name: IRYS V31 resumed public delay and outcome audit (NO SEND)
on:
  push:
    branches: [fix/irys-v31-latency-quality-20261104]
    paths: ['.github/workflows/v31-resume-public-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Freeze actual current main without changing code or market state
        run: |
          mkdir -p v31_resume
          git fetch --quiet --depth=1 origin main
          git rev-parse FETCH_HEAD > v31_resume/main_sha.txt
          git archive --format=zip --output=v31_resume/source.zip FETCH_HEAD
          git show FETCH_HEAD:data/v30_direction_latest.json > v31_resume/v30_direction_latest.json
          git show FETCH_HEAD:data/v30_state.json > v31_resume/v30_state.json
      - name: Read existing public health and official same-venue candles only
        run: |
          python - <<'PY'
          import json,time,datetime as dt,pathlib,urllib.request,urllib.parse
          p=pathlib.Path('v31_resume');UTC=dt.timezone.utc;KST=dt.timezone(dt.timedelta(hours=9));now=int(time.time()*1000)
          def get(url):
            with urllib.request.urlopen(urllib.request.Request(url,headers={'accept':'application/json','User-Agent':'IRYS-public-delay-audit'}),timeout=25) as r:return json.load(r)
          def save(name,x):(p/name).write_text(json.dumps(x,ensure_ascii=False,indent=2))
          h=get('https://irys-surge-monitor.vhehwpfl.workers.dev/?v31resume='+str(now));save('health.json',h)
          last=h.get('last') or {};ack=last.get('telegramLastApiReceipt') or {};v30=last.get('v30DirectionalDelivery') or {}
          summary={'read_at_utc':dt.datetime.now(UTC).isoformat(),'tick':last.get('time'),'version':last.get('codeVersion'),'status':last.get('status'),'delivery':v30,'last_public_ack':ack,'all_private_messages_accessed':False,'no_mutation_or_test_messages':True}
          save('summary.json',summary);print('V31_CURRENT_PUBLIC_STATE',json.dumps(summary,ensure_ascii=False))
          stamp=ack.get('ack_received_at_ms') or ack.get('recorded_send_ms') or ack.get('bot_accepted_at_ms');symbol=ack.get('symbol')
          if symbol and not stamp:
            stamp=int(dt.datetime.fromisoformat(ack['accepted_at'].replace(' KST','+09:00').replace(' ','T')).timestamp()*1000)
          if symbol and isinstance(stamp,int):
            end=min(now//60000*60000,(stamp//60000+62)*60000)
            if symbol.startswith('KRW-'):
              to=dt.datetime.fromtimestamp(end/1000,KST).strftime('%Y-%m-%dT%H:%M:%S')
              url='https://api.bithumb.com/v1/candles/minutes/1?'+urllib.parse.urlencode({'market':symbol,'to':to,'count':200})
            else:
              url='https://api.bitget.com/api/v2/mix/market/history-candles?'+urllib.parse.urlencode({'symbol':symbol,'productType':'USDT-FUTURES','granularity':'1m','endTime':end,'limit':200})
            save('last_ack_official_candles.json',{'receipt':ack,'event_ms':stamp,'source_url':url,'fetched_at_ms':now,'raw':get(url),'only_public_root_symbol':True})
          print('V31_NO_PRIVATE_EXTRACTION_NO_DEPLOYMENT_NO_TELEGRAM_NO_ORDERS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v31-resumed-public-audit-and-current-source
          path: v31_resume/
          retention-days: 7
          if-no-files-found: error
