name: IRYS V9 dual venue Bitget evidence regression (no deployment)
on:
  push:
    branches: [fix/irys-evidence-gates-20261028]
    paths:
      - 'deployment/IRYS_V9_SPOT_BITGET_DUAL_WORKER.mjs'
      - 'tests/test_irys_v9_bitget_direction.mjs'
      - '.github/workflows/verify-irys-v9-bitget.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax of independent code-only candidate
        run: node --check deployment/IRYS_V9_SPOT_BITGET_DUAL_WORKER.mjs
      - name: Old Bithumb collector and AI research regression
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python -m unittest discover -s ai_twin/tests -p 'test_*.py' -v
      - name: V9 Bitget LONG SHORT independent-flow positive negative and scheduled dispatch
        run: node --test tests/test_irys_v9_bitget_direction.mjs
