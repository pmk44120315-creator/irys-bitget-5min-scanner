name: IRYS V14 flow-diet live Cloudflare source lease READ ONLY
on:
  push:
    branches: [fix/irys-v14-flow-diet-isolated-20261029]
    paths:
      - '.github/workflows/v14-flow-diet-preflight.yml'
      - 'deployment/release-v14-safe.mjs'
      - 'deployment/parse-cloudflare-script.mjs'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      IRYS_V7_CF_API_TOKEN: ${{ secrets.IRYS_V7_CF_API_TOKEN }}
      IRYS_REALTIME_CF_ACCOUNT_ID: ${{ secrets.IRYS_REALTIME_CF_ACCOUNT_ID }}
      IRYS_V14_RELEASE_ONCE: AUTHORIZED_FROM_REVIEWED_MARKER
      IRYS_V14_RELEASE_DRY_RUN: '1'
      IRYS_V14_EXPECTED_SHA256: 'e05ad48dfbc155719fd475eac01cd452a4c33075f7cb1d24da014ef72820efe3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline syntax and previously verified immutable candidate
        run: |
          node --check deployment/IRYS_V14_NATIVE_MARKET_EVIDENCE_WORKER.mjs
          node --check deployment/release-v14-safe.mjs
          node --check deployment/parse-cloudflare-script.mjs
          test "$(sha256sum deployment/IRYS_V14_NATIVE_MARKET_EVIDENCE_WORKER.mjs | cut -d' ' -f1)" = "$IRYS_V14_EXPECTED_SHA256"
      - name: Read-only verify current Worker source SHA, existing KV/AI/Telegram bindings and 5m Cron
        run: node deployment/release-v14-safe.mjs
