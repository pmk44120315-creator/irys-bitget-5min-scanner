name: IRYS V28 resume actual-alert outcomes and missed-mover evidence
on:
  push:
    branches: [feature/irys-v28-bithumb-coverage-20261102]
    paths: ['.github/workflows/v28-resume-evidence.yml','diagnostics/v28_outcomes.py']
permissions:
  contents: read
concurrency:
  group: irys-v27-guarded-worker-source
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact scoped source read with propagation check and mandatory restore
        env:
          CF_ACCOUNT: ${{ secrets.IRYS_REALTIME_CF_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.IRYS_V7_CF_API_TOKEN }}
        run: |
          mkdir -p v28_evidence
          python - <<'PY'
          from pathlib import Path
          import textwrap
          s=Path('.github/workflows/v28-bithumb-miss-audit.yml').read_text()
          part=textwrap.dedent(s.split("node --input-type=module <<'JS'\n",1)[1].split('\n          JS',1)[0])
          assert "const OLD='f9213445d95a1c52e4d72eb47961e8d63188d3d99ed7876894d69907b3e00b1f'" in part
          a="async function read(path,opts={}){const r=await req('https://irys-surge-monitor.vhehwpfl.workers.dev/__v28/'+path,{...opts,headers:{authorization:'Bearer '+nonce,'content-type':'application/json'}});assert(r.ok);const x=await r.json();assert.equal(x.marker,marker);return x.data}"
          b="""async function read(path,opts={}){
           const end=Date.now()+60000;let reason='NOT_VISIBLE';
           do{
            const r=await req('https://irys-surge-monitor.vhehwpfl.workers.dev/__v28/'+path+(path.includes('?')?'&':'?')+'audit='+Date.now(),{...opts,headers:{authorization:'Bearer '+nonce,'content-type':'application/json','cache-control':'no-cache'}});
            if(r.ok){const x=await r.json();if(x.marker===marker)return x.data;reason='ROUTE_PROPAGATION_NOT_READY'}else reason='AUDIT_HTTP_'+r.status;
            if(Date.now()>=end)throw Error(reason);
            await new Promise(resolve=>setTimeout(resolve,1500));
           }while(Date.now()<=end);
           throw Error(reason);
          }"""
          assert part.count(a)==1
          part=part.replace(a,b)
          Path('/tmp/v28_state_audit.mjs').write_text(part)
          part=s.split("python - <<'PY'\n",1)[1].split('\n          PY',1)[0]
          Path('/tmp/v28_public_audit.py').write_text(textwrap.dedent(part))
          PY
          node /tmp/v28_state_audit.mjs
          python /tmp/v28_public_audit.py
      - name: Evaluate today's actual ACK messages using official 5/15/30/60 minute outcomes
        run: python diagnostics/v28_outcomes.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v28-resumed-actual-alert-evidence
          path: v28_evidence/
          retention-days: 7
          if-no-files-found: error
