name: IRYS V35.1 actual public ACK aftermath and source replay (READ ONLY)
on:
  push:
    branches: [fix/irys-v35-1-resume-20261106]
    paths: ['.github/workflows/v35-1-actual-ack-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Freeze current health and exact pre-ACK public source, then fetch native closed candles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p v351_audit
          python - <<'PY'
          import json,time,datetime as dt,pathlib,os,urllib.request,urllib.parse,csv
          p=pathlib.Path('v351_audit');repo='pmk44120315-creator/irys-bitget-5min-scanner';now=int(time.time()*1000)
          def get(url):
            headers={'User-Agent':'IRYS-user-authorized-readonly-audit','accept':'application/json'}
            if url.startswith('https://api.github.com/repos/'+repo+'/'):headers['Authorization']='Bearer '+os.environ['GH_TOKEN']
            with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=25) as r:return json.load(r)
          def save(name,x):(p/name).write_text(json.dumps(x,ensure_ascii=False,indent=2))
          h=get('https://irys-surge-monitor.vhehwpfl.workers.dev/?audit='+str(now));save('health.json',h)
          ack=h.get('last',{}).get('telegramLastApiReceipt') or {};stamp=ack.get('ack_received_at_ms') or ack.get('recorded_send_ms');symbol=ack.get('symbol')
          assert symbol and isinstance(stamp,int),'NO_PUBLIC_ACK_REFERENCE'
          until=dt.datetime.fromtimestamp(stamp/1000,dt.timezone.utc).isoformat()
          commits=get('https://api.github.com/repos/'+repo+'/commits?'+urllib.parse.urlencode({'path':'data/v30_direction_latest.json','until':until,'per_page':5}))
          item=None;source=None;sha=None
          for c in commits:
            doc=get('https://raw.githubusercontent.com/'+repo+'/'+c['sha']+'/data/v30_direction_latest.json')
            matches=[x for x in doc.get('items',[]) if x.get('candidate',{}).get('symbol')==symbol]
            if matches and doc.get('at_ms',stamp+1)<=stamp and stamp-doc['at_ms']<=90000:
              item=matches[0];source=doc;sha=c['sha'];break
          assert item is not None,'NO_EXACT_PRE_ACK_SOURCE'
          save('source_item.json',item);save('source_packet.json',source)
          direction=item['candidate']['direction'];venue=item['candidate']['venue'];ref=(stamp//60000+1)*60000
          end=min(now//60000*60000,ref+61*60000)
          if venue=='bitget':
            u='https://api.bitget.com/api/v2/mix/market/history-candles?'+urllib.parse.urlencode({'symbol':symbol,'productType':'USDT-FUTURES','granularity':'1m','endTime':end,'limit':200})
            raw=get(u);assert raw.get('code')=='00000';bars={int(x[0]):[float(n) for n in x[1:5]] for x in raw['data'] if int(x[0])+60000<=now}
          else:
            to=dt.datetime.fromtimestamp(end/1000,dt.timezone(dt.timedelta(hours=9))).strftime('%Y-%m-%dT%H:%M:%S')
            u='https://api.bithumb.com/v1/candles/minutes/1?'+urllib.parse.urlencode({'market':symbol,'to':to,'count':200})
            raw=get(u);bars={int(dt.datetime.fromisoformat(x['candle_date_time_utc']).replace(tzinfo=dt.timezone.utc).timestamp()*1000):[x[k] for k in ['opening_price','high_price','low_price','trade_price']] for x in raw}
          save('official_candles.json',{'source_url':u,'fetched_at_ms':now,'raw':raw})
          entry=item['final']['quote']['bid' if direction=='SHORT' else 'ask'];outcomes={}
          for minutes in [5,15,30,60]:
            close_at=((stamp+minutes*60000+59999)//60000)*60000;b=bars.get(close_at-60000)
            if close_at>now:outcomes[str(minutes)]={'status':'PENDING_HORIZON'};continue
            if b is None:outcomes[str(minutes)]={'status':'MISSING_TARGET_BAR'};continue
            signed=100*(entry-b[3])/entry if direction=='SHORT' else 100*(b[3]/entry-1)
            start=bars.get(ref);full=[bars[t] for t in range(ref,close_at,60000) if t in bars]
            outcomes[str(minutes)]={'status':'MEASURED_MINUTE_CLOSE_PROXY','close_at_ms':close_at,'exit_close':b[3],'original_ask_or_bid':entry,'signed_quote_to_close_pct':signed,'actual_fill_verified':False,
              'first_full_minute_open':start[0] if start else None,'first_full_minute_signed_pct':None if not start else (-1 if direction=='SHORT' else 1)*100*(b[3]/start[0]-1),
              'fully_observed_path':len(full)==(close_at-ref)//60000,
              'post_ack_max_price':max(x[1] for x in full) if full else None,'post_ack_min_price':min(x[2] for x in full) if full else None}
          summary={'read_at_utc':dt.datetime.now(dt.timezone.utc).isoformat(),'current_version':h['last'].get('codeVersion'),'tick':h['last'].get('time'),
            'actual_ack':ack,'reconstructed_direction':direction,'direction_source':'SAME_SYMBOL_PRE_ACK_PUBLIC_PACKET_NOT_PRIVATE_MESSAGE_BODY','source_commit':sha,
            'original_final_quote':item['final']['quote'],'source_start_to_ack_ms':stamp-source['started_at_ms'],'final_quote_to_ack_ms':stamp-item['final']['quote']['at_ms'],
            'outcomes':outcomes,'actual_aggregate':h['last'].get('v30DirectionalDelivery',{}).get('actual_alert_outcomes'),'lifecycle':h['last'].get('v30DirectionalDelivery',{}).get('signal_lifecycle'),
            'all_private_messages_read':False,'no_production_change':True}
          save('summary.json',summary);print('V351_ACTUAL_ACK_AUDIT',json.dumps(summary,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v351-actual-ack-and-original-source
          path: v351_audit/
          retention-days: 7
          if-no-files-found: error
