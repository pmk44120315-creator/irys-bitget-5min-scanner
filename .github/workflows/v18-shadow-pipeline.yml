name: IRYS V18 independent delayed-label prediction
on:
  push:
    branches:
      - feature/irys-v18-runtime-forecast-20261030
    paths:
      - '.github/workflows/v18-shadow-pipeline.yml'
      - 'v18_shadow_forecast.py'
      - 'tests/test_v18_shadow_forecast.py'
  workflow_run:
    workflows: ['IRYS V18 separate real-taker evidence collector']
    types: [completed]
permissions:
  contents: write
concurrency:
  group: irys-bitget-main-writers
  cancel-in-progress: false
  queue: max
jobs:
  verify:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Realistic clock and delayed-feedback regression
        run: |
          python -m py_compile v18_shadow_forecast.py
          python -m unittest discover -s tests -p test_v18_shadow_forecast.py -v
  shadow:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          git fetch --quiet origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm no-lookahead unit tests
        run: python -m unittest discover -s tests -p test_v18_shadow_forecast.py -v
      - name: Compare actual market future prices, research only
        id: model
        continue-on-error: true
        run: python v18_shadow_forecast.py
      - name: Preserve actual model inputs and results in separate files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/v18_shadow_latest.json
          if test -f data/v18_shadow_state.json; then git add data/v18_shadow_state.json; fi
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'data: V18 delayed-feedback shadow forecasts'
          for attempt in 1 2 3 4 5 6; do
            git fetch --quiet origin main
            if ! git rebase origin/main; then git rebase --abort; exit 1; fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Report all non-successful prediction reads
        if: steps.model.outcome == 'failure'
        run: exit 1
