name: IRYS V18 independent delayed-label prediction
on:
  push:
    branches:
      - feature/irys-v18-runtime-forecast-20261030
      - feature/irys-v21-causal-forecast-20261031
    paths:
      - '.github/workflows/v18-shadow-pipeline.yml'
      - 'v18_shadow_forecast.py'
      - 'v21_runtime.py'
      - 'v21_forecast_core.py'
      - 'tests/test_v18_shadow_forecast.py'
      - 'tests/test_v21_*.py'
  workflow_run:
    workflows: ['IRYS V18 separate real-taker evidence collector']
    types: [completed]
permissions:
  contents: write
concurrency:
  group: irys-v18-append-only-writers
  cancel-in-progress: false
  queue: max
jobs:
  verify:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Existing and learned-model causal regression
        run: |
          python -m py_compile v18_shadow_forecast.py v21_runtime.py v21_forecast_core.py
          python -m unittest discover -s tests -p test_v18_shadow_forecast.py -v
          python -m unittest discover -s tests -p 'test_v21_*.py' -v
  shadow:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          git fetch --quiet origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm existing no-lookahead unit tests
        run: python -m unittest discover -s tests -p test_v18_shadow_forecast.py -v
      - name: Compare existing market future prices, research only
        id: model
        continue-on-error: true
        run: python v18_shadow_forecast.py
      - name: V21 causal, quote freshness and economics contracts
        id: v21_tests
        continue-on-error: true
        run: python -m unittest discover -s tests -p 'test_v21_*.py' -v
      - name: Frozen V21 supervised forecast with actual public bid-ask validation
        id: v21
        if: steps.v21_tests.outcome == 'success'
        continue-on-error: true
        run: python v21_runtime.py
      - name: Preserve separate old/new predictions and evidence without overwriting collector data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/v18_shadow_latest.json
          if test -f data/v18_shadow_state.json; then git add data/v18_shadow_state.json; fi
          if test -f data/v21_latest.json; then git add data/v21_latest.json; fi
          if test -f data/v21_state.json; then git add data/v21_state.json; fi
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'data: independent legacy and V21 learned forecasts with future evidence'
          for attempt in 1 2 3 4 5 6; do
            git fetch --quiet origin main
            if ! git rebase origin/main; then git rebase --abort; exit 1; fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Do not hide failed forecasts or quote reads behind successful legacy scans
        if: steps.model.outcome == 'failure' || steps.v21.outcome == 'failure' || steps.v21_tests.outcome == 'failure'
        run: exit 1
  v22_adaptive:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-v22.txt
      - run: python -m pip install -r requirements-v22.txt
      - name: Refresh main after dependency setup, never read queued old snapshots
        run: |
          git fetch --quiet origin main
          git reset --hard origin/main
      - name: Verify causal learning and outcome-accounting contracts
        run: python -m unittest discover -s tests -p test_v22_all.py -v
      - name: Learn only completed public quote outcomes and issue new independent forecasts
        id: adaptive
        continue-on-error: true
        run: python v22_live.py
      - name: Commit only V22 records, preserving all original market and forecast files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test -f data/v22_latest.json
          git add data/v22_latest.json
          if test -f data/v22_state.json; then git add data/v22_state.json; fi
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'data: V22 complete-candidate adaptive forecasts and actual quote outcomes'
          for attempt in 1 2 3 4 5 6; do
            git fetch --quiet origin main
            if ! git rebase origin/main; then git rebase --abort; exit 1; fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Expose V22 failures independently of healthy legacy jobs
        if: steps.adaptive.outcome == 'failure'
        run: exit 1
