name: IRYS V21 reviewed forward-outcome integrity fix
on:
  push:
    branches: [feature/irys-v21-causal-forecast-20261031]
    paths:
      - .github/workflows/v21-coverage-review-fix.yml
permissions:
  contents: write
concurrency:
  group: irys-v21-build-only
  cancel-in-progress: false
jobs:
  reviewed-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply only exact reviewed runtime and matching delivery correction
        run: python diagnostics/v21_apply_coverage_review.py
      - name: Verify full old/new regression and generated Worker
        run: |
          python -m unittest discover -s tests -v
          node --test tests/test_v21_delivery.mjs
          node deployment/build_v21_worker.mjs
          node --check deployment/IRYS_V21_LEARNED_FORECAST_WORKER.mjs
      - name: Commit reviewed source and exact tested Worker, never main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v21_runtime.py deployment/v21_forecast_delivery.mjs tests/test_v21_delivery.mjs deployment/IRYS_V21_LEARNED_FORECAST_WORKER.mjs
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'fix(v21): include unmeasured forward outcomes in notification evidence'
          git fetch origin feature/irys-v21-causal-forecast-20261031
          git rebase origin/feature/irys-v21-causal-forecast-20261031
          git push origin HEAD:feature/irys-v21-causal-forecast-20261031
