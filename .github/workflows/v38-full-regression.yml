name: IRYS V38 first-pullback as-of full regression and real ticker review (NO SEND)
on:
  push:
    branches: [feature/irys-v38-pullback-reaccel-20261106]
    paths: ['deployment/v38*.mjs','tests/test_v38*.mjs','.github/workflows/v38-full-regression.yml','docs/IRYS_V38*']
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: v351-delivery-first-production-proof
          run-id: 42156639897
          github-token: ${{ github.token }}
          path: /tmp/v351
      - uses: actions/download-artifact@v4
        with:
          name: v35-deployed-natural-proof
          run-id: 42083867409
          github-token: ${{ github.token }}
          path: /tmp/v35
      - uses: actions/download-artifact@v4
        with:
          name: v31-guarded-production-natural-proof
          run-id: 41814867318
          github-token: ${{ github.token }}
          path: /tmp/v31
      - uses: actions/download-artifact@v4
        with:
          name: v30-selective-production-natural-proof
          run-id: 41693577194
          github-token: ${{ github.token }}
          path: /tmp/v30
      - uses: actions/download-artifact@v4
        with:
          name: v28-production-and-natural-verification
          run-id: 41450016477
          github-token: ${{ github.token }}
          path: /tmp/v28
      - name: Prepare exact independent old Worker fixtures without modifying source
        run: |
          mkdir -p v38_full_review
          git fetch --quiet --depth=1 origin release/irys-v24-bitget-fallback-20261101
          git show FETCH_HEAD:deployment/IRYS_V24_BITGET_FALLBACK_WORKER.mjs > /tmp/v24.mjs
          python deployment/build_v27_worker.py /tmp/v24.mjs deployment/IRYS_V27_RESPONSE_WORKER.mjs
          python deployment/build_v28_worker.py deployment/IRYS_V27_RESPONSE_WORKER.mjs deployment/IRYS_V28_BUILDUP_WORKER.mjs
          python deployment/build_v29_worker.py deployment/IRYS_V28_BUILDUP_WORKER.mjs deployment/IRYS_V29_DIRECTION_REVIEW_WORKER.mjs
          cp /tmp/v30/IRYS_V30_SELECTIVE_DIRECTION_WORKER.mjs deployment/
          cp /tmp/v31/IRYS_V31_TIMELY_WORKER.mjs deployment/
          python deployment/build_v34_worker.py deployment/IRYS_V31_TIMELY_WORKER.mjs deployment/IRYS_V34_CRASH_WARNING_WORKER.mjs
          cp /tmp/v35/IRYS_V35_LIFECYCLE_WORKER.mjs deployment/
          cp /tmp/v351/IRYS_V351_DELIVERY_FIRST_WORKER.mjs deployment/
          echo '6356cf5919e5dd05808d9b84bf92378393cc0b9a9da31e964d93566cc86c0d13  deployment/IRYS_V351_DELIVERY_FIRST_WORKER.mjs' | sha256sum -c -
          for f in deployment/v36*.mjs deployment/v38*.mjs; do node --check "$f"; done
      - name: Full original regression plus V38 first-turn and prospective-ledger tests
        env:
          V27_BASE_WORKER: /tmp/v24.mjs
          V28_BASE_WORKER: deployment/IRYS_V27_RESPONSE_WORKER.mjs
          V28_RELEASE_BASE_WORKER: /tmp/v28/IRYS_V28_BUILDUP_WORKER.mjs
          V29_BASE_WORKER: deployment/IRYS_V28_BUILDUP_WORKER.mjs
          V30_BASE_WORKER: deployment/IRYS_V29_DIRECTION_REVIEW_WORKER.mjs
          V34_BASE_WORKER: deployment/IRYS_V31_TIMELY_WORKER.mjs
          V35_BASE_WORKER: deployment/IRYS_V34_CRASH_WARNING_WORKER.mjs
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee v38_full_review/python_tests.log
          node --test tests/*.mjs 2>&1 | tee v38_full_review/node_tests.log
      - name: Verify ONEUSDT screenshot past time with no future bars and read genuine Bitget public tickers
        run: |
          set -o pipefail
          git fetch --quiet --depth=1 origin main
          git show origin/main:data/v24_bitget_fast_latest.json > data/v24_bitget_fast_latest.json
          node deployment/v38_reference_replay.mjs 2>&1 | tee v38_full_review/one_reference.log
          node deployment/v38_runner.mjs 2>&1 | tee v38_full_review/public_shadow.log
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';import {readFileSync,writeFileSync} from 'node:fs';
          const d=JSON.parse(readFileSync('data/v38_continuation_latest.json','utf8'));
          assert.equal(d.version,'V38_EARLY_PULLBACK_CONTINUATION_SHADOW_V1');
          assert.equal(d.research_only,true);assert.equal(d.live_signal_modified,false);
          assert.equal(d.telegram_sent,false);assert.equal(d.orders_sent,false);assert.equal(d.auto_promote,false);
          assert.equal(d.prediction_accuracy_proven,false);
          assert(d.history_requested>=0&&d.history_success>=0);
          writeFileSync('v38_full_review/actual_public_result.json',JSON.stringify(d,null,2));
          console.log('V38_PUBLIC_RESEARCH_REVIEW',JSON.stringify({inspected:d.inspected_symbols,history_requested:d.history_requested,
           history_success:d.history_success,new_events:d.new_events,tracked:d.tracked,source_errors:d.source_errors.length,
           market_source_verified:d.valid_current_tickers>100}));
          JS
      - name: Freeze exact code and evidence, no live deployment or test message
        if: always()
        run: |
          mkdir -p v38_full_review
          git archive --format=zip --output=v38_full_review/reviewed_source.zip HEAD
          test ! -f data/v38_continuation_latest.json || cp data/v38_continuation_latest.json v38_full_review/
          test ! -f data/v38_continuation_state.json || cp data/v38_continuation_state.json v38_full_review/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v38-pullback-full-regression-and-public-source
          path: v38_full_review/
          if-no-files-found: error
          retention-days: 7
