name: IRYS V39 actual-ACK direction feedback (NO LIVE ALERT CHANGES)
on:
  schedule:
    - cron: '14,44 * * * *'
  workflow_dispatch:
  push:
    branches: [research/irys-v39-direction-causal-audit-20261107]
    paths: ['research/v39*.mjs','research/v42_actual_ack_evaluation.mjs','tests/test_v42_ack_feedback.mjs','.github/workflows/v39-direction-causal-audit.yml']
permissions:
  contents: write
concurrency:
  group: irys-v39-public-ack-feedback-branch
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original and complete actual-ACK contracts
        run: |
          mkdir -p v39_direction_audit
          set -o pipefail
          node --test tests/test_v39*.mjs tests/test_v42_ack_feedback.mjs 2>&1 | tee v39_direction_audit/tests.log
      - name: Pin current public research source and durable actual-ACK ledger
        run: |
          git fetch --quiet --depth=1 origin main
          git rev-parse FETCH_HEAD > v39_direction_audit/main_source_commit.txt
          git show FETCH_HEAD:data/v36_shadow_state.json > data/v36_shadow_state.json
          git fetch --quiet --depth=1 origin data/irys-v39-ack-feedback
          git rev-parse FETCH_HEAD > v39_direction_audit/ledger_base_sha.txt
          if git cat-file -e FETCH_HEAD:data/v42_actual_ack_evaluation.json 2>/dev/null; then
            git show FETCH_HEAD:data/v42_actual_ack_evaluation.json > data/v42_actual_ack_evaluation.json
          else
            rm -f data/v42_actual_ack_evaluation.json
          fi
          node research/v39_direction_outcome_audit.mjs
      - name: Evaluate every retained actual ACK and unfinished historical horizon
        run: |
          node research/v42_actual_ack_evaluation.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';import {readFileSync} from 'node:fs';
          const d=JSON.parse(readFileSync('v39_direction_audit/v42_actual_ack_evaluation_next.json'));
          assert.equal(d.version,'V42_COMPLETE_ACTUAL_ACK_OUTCOMES_V1');assert.equal(d.telegram_sent,false);assert.equal(d.orders_sent,false);
          assert.equal(d.actual_execution_verified,false);assert.equal(d.diagnostics.conflicts,0);
          console.log('V42_ACK_COMPLETE_COHORT',JSON.stringify({diagnostics:d.diagnostics,summary:d.summary}));
          JS
      - name: Persist complete public evidence separately; retain old V39 ledger unchanged
        run: |
          set -euo pipefail
          BASE=$(cat v39_direction_audit/ledger_base_sha.txt)
          TARGET="$RUNNER_TEMP/v42-ledger-publication"
          git worktree add --detach "$TARGET" "$BASE"
          cp v39_direction_audit/v42_actual_ack_evaluation_next.json "$TARGET/data/v42_actual_ack_evaluation.json"
          git -C "$TARGET" config user.name 'github-actions[bot]'
          git -C "$TARGET" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$TARGET" add data/v42_actual_ack_evaluation.json
          if ! git -C "$TARGET" diff --staged --quiet; then
            git -C "$TARGET" commit -m 'data(v42): complete actual ACK outcomes and post-alert path evidence'
            git -C "$TARGET" push origin HEAD:refs/heads/data/irys-v39-ack-feedback
          fi
          git fetch --quiet --depth=1 origin data/irys-v39-ack-feedback
          git show FETCH_HEAD:data/v42_actual_ack_evaluation.json > v39_direction_audit/readback_ledger.json
          cmp v39_direction_audit/v42_actual_ack_evaluation_next.json v39_direction_audit/readback_ledger.json
          echo V42_COMPLETE_ACK_LEDGER_WRITE_AND_READBACK_VERIFIED
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v39-causal-direction-health-readonly
          path: v39_direction_audit/
          retention-days: 30
          if-no-files-found: error
