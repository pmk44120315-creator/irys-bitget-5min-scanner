name: IRYS V39 actual-ACK direction feedback (NO LIVE ALERT CHANGES)
on:
  schedule:
    - cron: '14,44 * * * *'
  workflow_dispatch:
  push:
    branches: [research/irys-v39-direction-causal-audit-20261107]
    paths: ['research/v39*.mjs','tests/test_v39*.mjs','.github/workflows/v39-direction-causal-audit.yml']
permissions:
  contents: write
concurrency:
  group: irys-v39-public-ack-feedback-branch
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pure tests including exact interrupted initial ledger
        run: |
          mkdir -p v39_direction_audit
          set -o pipefail
          node --test tests/test_v39*.mjs 2>&1 | tee v39_direction_audit/tests.log
      - name: Pin live public source and separate feedback branch before reads
        run: |
          git fetch --quiet --depth=1 origin main
          git rev-parse FETCH_HEAD > v39_direction_audit/main_source_commit.txt
          git show FETCH_HEAD:data/v36_shadow_state.json > data/v36_shadow_state.json
          git fetch --quiet --depth=1 origin data/irys-v39-ack-feedback
          git rev-parse FETCH_HEAD > v39_direction_audit/ledger_base_sha.txt
          git show FETCH_HEAD:data/v39_ack_feedback.json > data/v39_ack_feedback.json
          node research/v39_direction_outcome_audit.mjs
      - name: Read public Worker health only, never force scan or send Telegram
        run: |
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          const out={checked_at_utc:new Date().toISOString(),read_only:true,status:'NOT_VERIFIED'};
          try{
            const r=await fetch('https://irys-surge-monitor.vhehwpfl.workers.dev/?v39readonly='+Date.now(),{signal:AbortSignal.timeout(20000)});
            out.http=r.status;if(!r.ok)throw Error('HTTP_'+r.status);
            const h=await r.json(),l=h.last||{},d=l.v30DirectionalDelivery||{},a=l.telegramLastApiReceipt||{};
            Object.assign(out,{status:'OBSERVED',code_version:l.codeVersion,natural_tick_kst:l.time,last_status:l.status,
              entry_notifications_enabled:h.marketNotificationsEnabled,delivery_status:d.status,entry_feed_ok:d.feed?.ok,
              last_api_ack_symbol:a.symbol??null,last_api_ack_ms:a.ack_received_at_ms??a.recorded_send_ms??null,
              observed_alert_outcomes:d.actual_alert_outcomes??null,phone_delivery_verified:false});
          }catch(e){out.status='PUBLIC_HEALTH_UNAVAILABLE';out.error_type=e?.name||'Error';}
          writeFileSync('v39_direction_audit/worker_health_sanitized.json',JSON.stringify(out,null,2));
          console.log('V39_HEALTH',JSON.stringify(out));
          JS
      - name: Match actual ACK to source and reconcile immutable outcomes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node research/v39_latest_ack_replay.mjs
          node research/v39_ack_feedback_ledger.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';import {readFileSync} from 'node:fs';
          const d=JSON.parse(readFileSync('v39_direction_audit/v39_ack_feedback_next.json','utf8'));
          assert.equal(d.research_only,true);assert.equal(d.telegram_sent,false);assert.equal(d.orders_sent,false);
          assert.equal(d.actual_execution_verified,false);assert.equal(d.all_alerts_captured_proven,false);
          const receipt=JSON.parse(readFileSync('v39_direction_audit/feedback_receipt.json','utf8'));
          assert.equal(receipt.conflicts,0,'CONFLICTING_ACK_OUTCOMES_REQUIRE_REVIEW');
          console.log('V39_RECONCILE_PASS',JSON.stringify({events:d.events.length,asof_ms:d.asof_ms}));
          JS
      - name: Publish exact reviewed ledger to dedicated data branch, never main
        run: |
          set -euo pipefail
          BASE=$(cat v39_direction_audit/ledger_base_sha.txt)
          TARGET="$RUNNER_TEMP/v39-ledger-publication"
          git worktree add --detach "$TARGET" "$BASE"
          cp v39_direction_audit/v39_ack_feedback_next.json "$TARGET/data/v39_ack_feedback.json"
          git -C "$TARGET" config user.name 'github-actions[bot]'
          git -C "$TARGET" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$TARGET" add data/v39_ack_feedback.json
          if ! git -C "$TARGET" diff --staged --quiet; then
            git -C "$TARGET" commit -m 'data(v39): preserve actual ACK and measured future outcomes'
            git -C "$TARGET" push origin HEAD:refs/heads/data/irys-v39-ack-feedback
          fi
          git -C "$TARGET" rev-parse HEAD > v39_direction_audit/published_commit.txt
          git fetch --quiet --depth=1 origin data/irys-v39-ack-feedback
          git show FETCH_HEAD:data/v39_ack_feedback.json > v39_direction_audit/readback_ledger.json
          cmp v39_direction_audit/v39_ack_feedback_next.json v39_direction_audit/readback_ledger.json
          echo V39_DEDICATED_LEDGER_WRITE_AND_READBACK_VERIFIED
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v39-causal-direction-health-readonly
          path: v39_direction_audit/
          retention-days: 30
          if-no-files-found: error
