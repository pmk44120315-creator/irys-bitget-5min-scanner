name: IRYS V16 AI-first provisional BUY LONG SHORT guarded Worker rollout ONCE
on:
  push:
    branches: [fix/irys-v16-ai-first-early-watch-20261030]
    paths:
      - 'deployment/IRYS_V16_AI_EARLY_RELEASE_APPROVED_20261030.txt'
permissions:
  contents: read
concurrency:
  group: irys-surge-monitor-v14-release-once
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      IRYS_V7_CF_API_TOKEN: ${{ secrets.IRYS_V7_CF_API_TOKEN }}
      IRYS_REALTIME_CF_ACCOUNT_ID: ${{ secrets.IRYS_REALTIME_CF_ACCOUNT_ID }}
      IRYS_V14_RELEASE_ONCE: AUTHORIZED_FROM_REVIEWED_MARKER
      IRYS_V14_RELEASE_DRY_RUN: '0'
      IRYS_V14_EXPECTED_SHA256: '8668138db2c213c7b675e1a10f6b8bb9c5824b757a1648a9feeae073094c9f73'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require one-time user-approved marker and immutable test SHA
        run: |
          grep -Fxq 'IRYS_V16_AI_EARLY_RELEASE_APPROVED=USER_REQUESTED_UNBLOCK_ALERTS_20261030' deployment/IRYS_V16_AI_EARLY_RELEASE_APPROVED_20261030.txt
          grep -Fxq 'WORKER_SHA256=8668138db2c213c7b675e1a10f6b8bb9c5824b757a1648a9feeae073094c9f73' deployment/IRYS_V16_AI_EARLY_RELEASE_APPROVED_20261030.txt
          test "$(sha256sum deployment/IRYS_V16_AI_FIRST_LIVE_WORKER.mjs | cut -d' ' -f1)" = "$IRYS_V14_EXPECTED_SHA256"
      - name: Full offline regression and one-time mock Telegram delivery
        run: |
          node --check deployment/IRYS_V16_AI_FIRST_LIVE_WORKER.mjs
          node --check deployment/release-v16-ai-early-safe.mjs
          node --test tests/test_irys_v16_ai_first.mjs tests/test_irys_v16_ai_live_logic.mjs tests/test_irys_v16_outcome_offline.mjs tests/test_irys_v16_ai_delivery_mock.mjs tests/test_irys_v15_telegram_proof.mjs
          python -m unittest discover -s tests -p 'test_*.py' -v
          python -m unittest discover -s ai_twin/tests -p 'test_*.py' -v
      - name: Replace only irys-surge-monitor code with previous SHA lease, verify bindings/Cron or rollback
        run: node deployment/release-v16-ai-early-safe.mjs
