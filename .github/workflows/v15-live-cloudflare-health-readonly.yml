name: IRYS V15 current Cloudflare V14 transport/alerts diagnostic READ ONLY
on:
  push:
    branches: [fix/irys-v15-flow-causal-proof-20261029]
    paths:
      - '.github/workflows/v15-live-cloudflare-health-readonly.yml'
      - 'audits/v15_cloudflare_readonly.marker'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      IRYS_V7_CF_API_TOKEN: ${{ secrets.IRYS_V7_CF_API_TOKEN }}
      IRYS_REALTIME_CF_ACCOUNT_ID: ${{ secrets.IRYS_REALTIME_CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: GET-only Worker source, bindings, Cron and latest Telegram delivery evidence
        run: |
          node --check deployment/check-v14-flow-diet-live.mjs
          node deployment/check-v14-flow-diet-live.mjs
