name: IRYS V15 Telegram transport one-time Cloudflare preflight READ ONLY
on:
  push:
    branches: [fix/irys-v15-telegram-closure-20261030]
    paths:
      - '.github/workflows/v15-telegram-proof-dryrun.yml'
      - 'deployment/release-v15-telegram-once-safe.mjs'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      IRYS_V7_CF_API_TOKEN: ${{ secrets.IRYS_V7_CF_API_TOKEN }}
      IRYS_REALTIME_CF_ACCOUNT_ID: ${{ secrets.IRYS_REALTIME_CF_ACCOUNT_ID }}
      IRYS_V14_RELEASE_ONCE: AUTHORIZED_FROM_REVIEWED_MARKER
      IRYS_V14_RELEASE_DRY_RUN: '1'
      IRYS_V14_EXPECTED_SHA256: '48caae284be09d13004340a1c3167754acdfdf33d2d6a8a9c05a93b4c4143e2a'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm immutable test-only source, read-only health, safe source rollback script
        run: |
          node --check deployment/IRYS_V15_TELEGRAM_TRANSPORT_PROOF_WORKER.mjs
          node --check deployment/release-v15-telegram-once-safe.mjs
          test "$(sha256sum deployment/IRYS_V15_TELEGRAM_TRANSPORT_PROOF_WORKER.mjs | cut -d' ' -f1)" = "$IRYS_V14_EXPECTED_SHA256"
          node deployment/release-v15-telegram-once-safe.mjs
