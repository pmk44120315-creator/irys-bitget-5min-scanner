name: V48 full production regression and evidence (NO DEPLOY)
on:
  push:
    branches: [upgrade/irys-v48-evidence-20261113]
    paths: ['.github/workflows/v48-full-regression.yml','verification/v48/run-ci.txt']
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve exact source before running any verification
        run: |
          mkdir -p v48_verified
          git rev-parse HEAD > v48_verified/source_commit.txt
          git archive --format=zip --output=v48_verified/source.zip HEAD
      - run: python -m pip install 'numpy==2.3.5' 'scikit-learn==1.8.0' 'PyYAML==6.0.2'
      - name: Reconstruct expired fixtures from exact released commits and verify hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python verification/v48/reconstruct_fixtures.py
      - name: Complete stdlib production regression
        id: stdlib
        continue-on-error: true
        run: |
          set -o pipefail
          python -S -m unittest discover -s tests -v 2>&1 | tee v48_verified/python.log
      - name: Workflow and research regression
        id: python_extra
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m unittest discover -s verification/workflows -v 2>&1 | tee v48_verified/workflows.log
          python -m unittest discover -s research/tests -v 2>&1 | tee v48_verified/research.log
          python -m unittest discover -s ai_twin/tests -v 2>&1 | tee v48_verified/ai_twin.log
      - name: All production modules, compiled workers and release rollback contracts
        id: node
        continue-on-error: true
        env:
          V27_BASE_WORKER: /tmp/v24.mjs
          V28_BASE_WORKER: deployment/IRYS_V27_RESPONSE_WORKER.mjs
          V28_RELEASE_BASE_WORKER: /tmp/v28/IRYS_V28_BUILDUP_WORKER.mjs
          V29_BASE_WORKER: deployment/IRYS_V28_BUILDUP_WORKER.mjs
          V30_BASE_WORKER: deployment/IRYS_V29_DIRECTION_REVIEW_WORKER.mjs
          V34_BASE_WORKER: deployment/IRYS_V31_TIMELY_WORKER.mjs
          V35_BASE_WORKER: deployment/IRYS_V34_CRASH_WARNING_WORKER.mjs
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(tests/*.mjs verification/v45/test*.mjs verification/v46/test*.mjs verification/v48/test*.mjs)
          node --test "${tests[@]}" 2>&1 | tee v48_verified/node.log
      - name: Replay original V47 incident without synthetic success
        id: replay
        continue-on-error: true
        run: node verification/v47/replay_original.mjs /tmp/v47-original v48_verified/v47_original_replay.json
      - name: Official public historical-window smoke test when present
        id: smoke
        continue-on-error: true
        run: |
          if test -f verification/v48/official_history_smoke.mjs; then
            node verification/v48/official_history_smoke.mjs v48_verified/official_smoke.json
          fi
      - name: Preserve explicit results and all evidence even on failure
        if: always()
        env:
          STDLIB: ${{ steps.stdlib.outcome }}
          PYTHON_EXTRA: ${{ steps.python_extra.outcome }}
          NODE: ${{ steps.node.outcome }}
          REPLAY: ${{ steps.replay.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,json,hashlib
          p=Path('v48_verified');p.mkdir(exist_ok=True)
          (p/'outcomes.json').write_text(json.dumps({k:os.environ[k] for k in ['STDLIB','PYTHON_EXTRA','NODE','REPLAY','SMOKE']},indent=2))
          m={str(f.relative_to(p)):{'bytes':f.stat().st_size,'sha256':hashlib.sha256(f.read_bytes()).hexdigest()} for f in p.rglob('*') if f.is_file()}
          (p/'manifest.json').write_text(json.dumps(m,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v48-full-regression-proof
          path: v48_verified/
          retention-days: 30
          if-no-files-found: error
      - name: Enforce all required checks rather than hiding failures
        if: steps.stdlib.outcome != 'success' || steps.python_extra.outcome != 'success' || steps.node.outcome != 'success' || steps.replay.outcome != 'success' || steps.smoke.outcome != 'success'
        run: exit 1
