name: IRYS V15 Telegram one-time real delivery proof READ ONLY
on:
  push:
    branches: [fix/irys-v15-telegram-closure-20261030]
    paths:
      - '.github/workflows/v15-telegram-proof-health.yml'
      - 'audits/IRYS_V15_TELEGRAM_READONLY_HEALTH_20261030.marker'
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    env:
      IRYS_V7_CF_API_TOKEN: ${{ secrets.IRYS_V7_CF_API_TOKEN }}
      IRYS_REALTIME_CF_ACCOUNT_ID: ${{ secrets.IRYS_REALTIME_CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm current deployed SHA, Cron, and real Telegram API acknowledgement
        run: |
          node --check deployment/check-v15-telegram-proof-live.mjs
          node deployment/check-v15-telegram-proof-live.mjs
