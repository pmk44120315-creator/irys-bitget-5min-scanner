name: IRYS V30 official paired directional evidence (NO MESSAGES)
on:
  workflow_run:
    workflows: ['Bitget five-minute read-only snapshot']
    types: [requested]
permissions:
  contents: read
concurrency:
  group: irys-v30-public-pair-main-writer
  cancel-in-progress: false
  queue: max
jobs:
  produce:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Resolve current producer code and previous own state at actual start
        run: |
          git fetch --quiet origin main
          git reset --hard origin/main
          echo "V30_SOURCE_SHA=$(git rev-parse HEAD)"
      - name: Pure evidence, producer and delivery checks without live Telegram
        run: node --test tests/test_v30_core.mjs tests/test_v30_producer.mjs tests/test_v30_delivery.mjs tests/test_v35_lifecycle.mjs tests/test_v35_producer.mjs tests/test_v45_rsi_context.mjs tests/test_v45_producer.mjs
      - name: Official public first samples, disjoint new trades, final quotes and outcomes
        id: producer
        continue-on-error: true
        run: node deployment/v30_producer.mjs
      - name: Independently publish current public evidence before any history refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test -f data/v30_direction_latest.json
          test -f data/v30_state.json
          git add data/v30_direction_latest.json data/v30_state.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'data(v30): original public paired evidence and frozen hypothesis outcomes'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch --quiet origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo '::error::V30 evidence collision: newer main preserved, no force push'
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          echo '::error::V30 output not published; do not label prior generation fresh'
          exit 1
      - name: Publish genuinely newer Bitget quotes through existing trusted runner transport
        id: dispatch_quotes
        if: steps.producer.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          export V30_PUBLISHED_COMMIT=$(git rev-parse HEAD)
          git fetch --quiet --depth=1 origin data/irys-v421-dispatch-quotes
          BASE=$(git rev-parse FETCH_HEAD)
          TARGET="$RUNNER_TEMP/v421-quotes"
          git worktree add --detach "$TARGET" "$BASE"
          node deployment/v45_quote_producer.mjs "$TARGET/data/v421_dispatch_quotes.json"
          git -C "$TARGET" config user.name 'github-actions[bot]'
          git -C "$TARGET" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$TARGET" add data/v421_dispatch_quotes.json
          git -C "$TARGET" commit -m 'data(v421): newer original official quotes after paired-evidence publication'
          git -C "$TARGET" push origin HEAD:refs/heads/data/irys-v421-dispatch-quotes
          git fetch --quiet --depth=1 origin data/irys-v421-dispatch-quotes
          git show FETCH_HEAD:data/v421_dispatch_quotes.json > "$RUNNER_TEMP/v421-readback.json"
          cmp "$TARGET/data/v421_dispatch_quotes.json" "$RUNNER_TEMP/v421-readback.json"
          echo V421_CURRENT_QUOTE_PUBLICATION_READBACK_VERIFIED
      - name: Historical prices after current evidence has already been published
        if: steps.producer.outcome == 'success'
        run: |
          node deployment/v35_history.mjs
          git add data/v35_outcome_history.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'data(v35): separate native outcome history after timely signal publication'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch --quiet origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo '::error::History cache collision: preserve main, no force push'
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Never hide a failed provider collection behind successful commit
        if: steps.producer.outcome == 'failure'
        run: exit 1
      - name: Surface quote-transport errors after preserving historical collection
        if: steps.dispatch_quotes.outcome == 'failure'
        run: |
          echo '::error::V42.1 post-publication quote transport failed; do not reuse old quotes'
          exit 1
