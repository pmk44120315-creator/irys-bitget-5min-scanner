name: IRYS V36 prospective counter-evidence code and official-source review (NO SEND)
on:
  push:
    branches: [feature/irys-v36-counterevidence-shadow-20261106]
    paths: ['deployment/v36*.mjs','tests/test_v36*.mjs','.github/workflows/v36-review.yml','docs/IRYS_V36*']
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: v351-delivery-first-production-proof
          run-id: 42156639897
          github-token: ${{ github.token }}
          path: /tmp/v351
      - uses: actions/download-artifact@v4
        with:
          name: v35-deployed-natural-proof
          run-id: 42083867409
          github-token: ${{ github.token }}
          path: /tmp/v35
      - uses: actions/download-artifact@v4
        with:
          name: v31-guarded-production-natural-proof
          run-id: 41814867318
          github-token: ${{ github.token }}
          path: /tmp/v31
      - uses: actions/download-artifact@v4
        with:
          name: v30-selective-production-natural-proof
          run-id: 41693577194
          github-token: ${{ github.token }}
          path: /tmp/v30
      - uses: actions/download-artifact@v4
        with:
          name: v28-production-and-natural-verification
          run-id: 41450016477
          github-token: ${{ github.token }}
          path: /tmp/v28
      - name: Prepare exact independent old Worker fixtures without modifying source
        run: |
          mkdir -p v36_review
          git fetch --quiet --depth=1 origin release/irys-v24-bitget-fallback-20261101
          git show FETCH_HEAD:deployment/IRYS_V24_BITGET_FALLBACK_WORKER.mjs > /tmp/v24.mjs
          python deployment/build_v27_worker.py /tmp/v24.mjs deployment/IRYS_V27_RESPONSE_WORKER.mjs
          python deployment/build_v28_worker.py deployment/IRYS_V27_RESPONSE_WORKER.mjs deployment/IRYS_V28_BUILDUP_WORKER.mjs
          python deployment/build_v29_worker.py deployment/IRYS_V28_BUILDUP_WORKER.mjs deployment/IRYS_V29_DIRECTION_REVIEW_WORKER.mjs
          cp /tmp/v30/IRYS_V30_SELECTIVE_DIRECTION_WORKER.mjs deployment/
          cp /tmp/v31/IRYS_V31_TIMELY_WORKER.mjs deployment/
          python deployment/build_v34_worker.py deployment/IRYS_V31_TIMELY_WORKER.mjs deployment/IRYS_V34_CRASH_WARNING_WORKER.mjs
          cp /tmp/v35/IRYS_V35_LIFECYCLE_WORKER.mjs deployment/
          cp /tmp/v351/IRYS_V351_DELIVERY_FIRST_WORKER.mjs deployment/
          echo '6356cf5919e5dd05808d9b84bf92378393cc0b9a9da31e964d93566cc86c0d13  deployment/IRYS_V351_DELIVERY_FIRST_WORKER.mjs' | sha256sum -c -
          for f in deployment/v36*.mjs; do node --check "$f"; done
      - name: Full original regression and new V36 forward-only tests
        env:
          V27_BASE_WORKER: /tmp/v24.mjs
          V28_BASE_WORKER: deployment/IRYS_V27_RESPONSE_WORKER.mjs
          V28_RELEASE_BASE_WORKER: /tmp/v28/IRYS_V28_BUILDUP_WORKER.mjs
          V29_BASE_WORKER: deployment/IRYS_V28_BUILDUP_WORKER.mjs
          V30_BASE_WORKER: deployment/IRYS_V29_DIRECTION_REVIEW_WORKER.mjs
          V34_BASE_WORKER: deployment/IRYS_V31_TIMELY_WORKER.mjs
          V35_BASE_WORKER: deployment/IRYS_V34_CRASH_WARNING_WORKER.mjs
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee v36_review/python_tests.log
          node --test tests/*.mjs 2>&1 | tee v36_review/node_tests.log
      - name: Genuine current official Bithumb and Bitget public source smoke, shadow only
        run: |
          git fetch --quiet --depth=1 origin main
          git show origin/main:data/v30_direction_latest.json > data/v30_direction_latest.json
          git show origin/main:data/v34_crash_latest.json > data/v34_crash_latest.json
          node deployment/v36_runner.mjs | tee v36_review/public_shadow.log
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';import assert from 'node:assert/strict';
          const x=JSON.parse(readFileSync('data/v36_shadow_latest.json','utf8'));
          assert.equal(x.version,'V36_CONTRA_PROSPECTIVE_SHADOW_V1');
          assert.equal(x.telegram_sent,false);assert.equal(x.orders_sent,false);assert.equal(x.auto_promotion,false);
          assert(['OBSERVED','SOURCE_NOT_ELIGIBLE'].includes(x.status));
          assert(x.source_errors.every(e=>!e.token&&!e.secret));
          writeFileSync('v36_review/actual_public_result.json',JSON.stringify(x,null,2));
          console.log('V36_ACTUAL_SHADOW_VALIDATION',JSON.stringify({status:x.status,new_events:x.new_events,tracked:x.tracked_episodes,markets:x.successful_native_histories,source_errors:x.source_errors.length}));
          JS
      - name: Freeze exact code and evidence, no live deployment or test message
        if: always()
        run: |
          mkdir -p v36_review
          git archive --format=zip --output=v36_review/reviewed_source.zip HEAD
          test ! -f data/v36_shadow_latest.json || cp data/v36_shadow_latest.json v36_review/
          test ! -f data/v36_shadow_state.json || cp data/v36_shadow_state.json v36_review/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v36-prospective-shadow-review
          path: v36_review/
          if-no-files-found: error
          retention-days: 7
