name: IRYS direction evidence repair - full source regression (NO DEPLOY)
on:
  push:
    branches: [fix/irys-direction-evidence-20261107]
    paths:
      - 'deployment/v36*.mjs'
      - 'deployment/v37*.mjs'
      - 'deployment/direction_response_research.mjs'
      - 'tests/test_direction*.mjs'
      - '.github/workflows/irys-direction-repair-20261107.yml'
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: v351-delivery-first-production-proof
          run-id: 42156639897
          github-token: ${{ github.token }}
          path: /tmp/v351
      - uses: actions/download-artifact@v4
        with:
          name: v35-deployed-natural-proof
          run-id: 42083867409
          github-token: ${{ github.token }}
          path: /tmp/v35
      - uses: actions/download-artifact@v4
        with:
          name: v31-guarded-production-natural-proof
          run-id: 41814867318
          github-token: ${{ github.token }}
          path: /tmp/v31
      - uses: actions/download-artifact@v4
        with:
          name: v30-selective-production-natural-proof
          run-id: 41693577194
          github-token: ${{ github.token }}
          path: /tmp/v30
      - uses: actions/download-artifact@v4
        with:
          name: v28-production-and-natural-verification
          run-id: 41450016477
          github-token: ${{ github.token }}
          path: /tmp/v28
      - name: Match local reviewed source bytes (sha256)
        run: |
          cat <<'CHECKSUMS' | sha256sum -c -
          1b494334e5d58384b43a1fca57920cc10f527cdae4f5c88f90ae2d8b71690df8  deployment/direction_response_research.mjs
          17f252b4b390eb6508ec0fb23163a7ac25c9d25ee04622420c2b460e480e1d76  deployment/v36_hypotheses.mjs
          4e04edba266a929e10ca801d7b8c47797733b7234df7cfce7076ce2c3cb540b3  deployment/v36_shadow.mjs
          347d6650c825b3ee4d5f16be814c6123c00dd1a2344c6f0d9c25bd7971b64540  deployment/v37_early.mjs
          6453034d9df7c6e804d87dd28cc00375d590b44d72a4c2ea4c662214f0e8b67e  tests/test_direction_repair.mjs
          d1653f239756b96fa6f5d004098b198bb4ce32812380cd20223fac028893f200  tests/test_direction_response_research.mjs
          a8958c8b29a8932895418989322d70d7fe1d39511934b2ff455a8bdb5d107bbb  deployment/v36_runner.mjs
          c3cbe60adf0172c7594f34b09250854827252616deba946fb3ebda76f1c08934  tests/test_direction_reporting.mjs
          CHECKSUMS
      - name: JavaScript syntax checks
        run: |
          for f in deployment/direction_response_research.mjs deployment/v36*.mjs deployment/v37*.mjs; do node --check "$f"; done
      - name: Focused 62-test regression
        run: node --test tests/test_v36_shadow.mjs tests/test_v37_early.mjs tests/test_direction_repair.mjs tests/test_direction_response_research.mjs tests/test_direction_reporting.mjs
      - name: Reconstruct prior exact Worker test fixtures (no deployment)
        run: |
          git fetch --quiet --depth=1 origin release/irys-v24-bitget-fallback-20261101
          git show FETCH_HEAD:deployment/IRYS_V24_BITGET_FALLBACK_WORKER.mjs > /tmp/v24.mjs
          python deployment/build_v27_worker.py /tmp/v24.mjs deployment/IRYS_V27_RESPONSE_WORKER.mjs
          python deployment/build_v28_worker.py deployment/IRYS_V27_RESPONSE_WORKER.mjs deployment/IRYS_V28_BUILDUP_WORKER.mjs
          python deployment/build_v29_worker.py deployment/IRYS_V28_BUILDUP_WORKER.mjs deployment/IRYS_V29_DIRECTION_REVIEW_WORKER.mjs
          cp /tmp/v30/IRYS_V30_SELECTIVE_DIRECTION_WORKER.mjs deployment/
          cp /tmp/v31/IRYS_V31_TIMELY_WORKER.mjs deployment/
          python deployment/build_v34_worker.py deployment/IRYS_V31_TIMELY_WORKER.mjs deployment/IRYS_V34_CRASH_WARNING_WORKER.mjs
          cp /tmp/v35/IRYS_V35_LIFECYCLE_WORKER.mjs deployment/
          cp /tmp/v351/IRYS_V351_DELIVERY_FIRST_WORKER.mjs deployment/
          echo '6356cf5919e5dd05808d9b84bf92378393cc0b9a9da31e964d93566cc86c0d13  deployment/IRYS_V351_DELIVERY_FIRST_WORKER.mjs' | sha256sum -c -
      - name: Complete Python unittest regression
        env:
          V27_BASE_WORKER: /tmp/v24.mjs
          V28_BASE_WORKER: deployment/IRYS_V27_RESPONSE_WORKER.mjs
          V28_RELEASE_BASE_WORKER: /tmp/v28/IRYS_V28_BUILDUP_WORKER.mjs
          V29_BASE_WORKER: deployment/IRYS_V28_BUILDUP_WORKER.mjs
          V30_BASE_WORKER: deployment/IRYS_V29_DIRECTION_REVIEW_WORKER.mjs
          V34_BASE_WORKER: deployment/IRYS_V31_TIMELY_WORKER.mjs
          V35_BASE_WORKER: deployment/IRYS_V34_CRASH_WARNING_WORKER.mjs
        run: python -m unittest discover -s tests -v
      - name: Complete Node test regression
        env:
          V27_BASE_WORKER: /tmp/v24.mjs
          V28_BASE_WORKER: deployment/IRYS_V27_RESPONSE_WORKER.mjs
          V28_RELEASE_BASE_WORKER: /tmp/v28/IRYS_V28_BUILDUP_WORKER.mjs
          V29_BASE_WORKER: deployment/IRYS_V28_BUILDUP_WORKER.mjs
          V30_BASE_WORKER: deployment/IRYS_V29_DIRECTION_REVIEW_WORKER.mjs
          V34_BASE_WORKER: deployment/IRYS_V31_TIMELY_WORKER.mjs
          V35_BASE_WORKER: deployment/IRYS_V34_CRASH_WARNING_WORKER.mjs
        run: node --test tests/*.mjs
      - name: Current official-market shadow smoke (no remote writes or alerts)
        run: |
          git fetch --quiet origin main
          for f in data/v30_direction_latest.json data/v36_shadow_state.json data/v30_state.json data/v24_bitget_fast_latest.json data/v37_early_state.json; do
            git show origin/main:"$f" > "$f"
          done
          node deployment/v36_runner.mjs
          node deployment/v37_runner.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const v36=JSON.parse(readFileSync('data/v36_shadow_latest.json','utf8'));
          const v37=JSON.parse(readFileSync('data/v37_early_latest.json','utf8'));
          const state=JSON.parse(readFileSync('data/v37_early_state.json','utf8'));
          assert.equal(v36.version,'V36_CONTRA_PROSPECTIVE_SHADOW_V1');
          assert.equal(v37.version,'V37_PREMOVE_OPPORTUNITY_SHADOW_V1');
          assert(v36.direction_response_comparisons && v36.direction_response_comparisons['5']);
          for(const x of [v36,v37]){
            assert.equal(x.telegram_sent,false);
            assert.equal(x.orders_sent,false);
            assert.equal(x.shadow_only,true);
            assert.equal(x.prediction_accuracy_proven===true,false);
          }
          assert(state.futuresHistory&&typeof state.futuresHistory==='object');
          console.log('IRYS_PUBLIC_READ_ONLY_SMOKE',JSON.stringify({v36_status:v36.status,v36_new_events:v36.new_events,v36_measured5:v36.direction_response_comparisons['5'].measured_records,v37_spot:v37.spot_candidates_observed,v37_futures:v37.futures_candidates_observed,v37_selected:v37.selected_early_count,v37_history_symbols:Object.keys(state.futuresHistory).length,source_errors_v36:v36.source_errors?.length,source_errors_v37:v37.source_errors?.length}));
          JS
      - name: No live deployment or Telegram side effects
        run: |
          echo 'Research-only branch verification. No market-alert, order, or Cloudflare deployment steps exist in this workflow.'
