name: IRYS V27 isolated authenticated receipt read and cleanup
on:
  push:
    branches: [feature/irys-v27-actual-alert-audit-20261102]
    paths: ['.github/workflows/v27-authorized-kv-reader.yml']
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Independently read market receipts; preserve original script byte-for-byte
        env:
          CF_ACCOUNT: ${{ secrets.IRYS_REALTIME_CF_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.IRYS_V7_CF_API_TOKEN }}
        run: |
          mkdir -p v27_packet
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          import {createHash,randomBytes} from 'node:crypto';
          import assert from 'node:assert/strict';
          const account=process.env.CF_ACCOUNT,token=process.env.CF_TOKEN;
          assert(/^[a-f0-9]{32}$/.test(account)&&token.length>20,'AUTH_NOT_CONFIGURED');
          const base='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/scripts/';
          const production=base+'irys-surge-monitor';
          const name='irys-v27-read-'+process.env.GITHUB_RUN_ID;
          const endpoint=base+name;
          const auth={authorization:'Bearer '+token};
          const hash=b=>createHash('sha256').update(b).digest('hex');
          const save=(n,x)=>writeFileSync('v27_packet/'+n,JSON.stringify(x,null,2));
          async function req(url,options={}){
            const r=await fetch(url,{...options,signal:AbortSignal.timeout(35000)});
            return r;
          }
          async function cf(url,options={}){
            const r=await req(url,{...options,headers:{...auth,...options.headers}});
            if(!r.ok)throw Error('CF_HTTP_'+r.status);
            const j=await r.json();assert(j.success===true,'CF_REPORTED_FAILURE');return j;
          }
          async function source(url){
            const r=await req(url,{headers:auth});assert(r.ok,'SOURCE_HTTP_'+r.status);
            if((r.headers.get('content-type')||'').startsWith('multipart/')){
              const f=await r.formData(),m=f.get('metadata');
              const meta=m?JSON.parse(typeof m==='string'?m:await m.text()):{};
              const part=f.get(meta.main_module||meta.body_part||'worker.js');
              assert(part,'MAIN_MODULE_MISSING');return Buffer.from(typeof part==='string'?part:await part.arrayBuffer());
            }
            return Buffer.from(await r.arrayBuffer());
          }
          const original=await source(production);
          writeFileSync('v27_packet/live_worker.mjs',original);
          const settings=(await cf(production+'/settings')).result;
          const ns=settings.bindings.find(x=>x.name==='IRYS_KV'&&x.type==='kv_namespace').namespace_id;
          const cron=await cf(production+'/schedules');
          const health=await (await req('https://irys-surge-monitor.vhehwpfl.workers.dev/')).json();
          save('health.json',health);
          const nonce=randomBytes(32).toString('hex');
          const marker='V27_AUTHORIZED_READ_ONLY_'+process.env.GITHUB_RUN_ID;
          const body=`const NONCE=${JSON.stringify(nonce)};const PREFIX='irys:fast:delivery-receipt:v12:';
          export default {async fetch(req,env){
            if(req.headers.get('authorization')!=='Bearer '+NONCE)return new Response('Not found',{status:404});
            const u=new URL(req.url);let out;
            if(u.pathname==='/state'){
              const s=JSON.parse(await env.IRYS_KV.get('irys:fast:state:v1')||'{}');
              const keep=Object.fromEntries(Object.entries(s).filter(([k])=>/receipt|outcome|v23scout|v21last|acknowledgement/i.test(k)||k==='last'));
              out={inventory:Object.fromEntries(Object.entries(s).map(([k,v])=>[k,{type:typeof v,length:Array.isArray(v)?v.length:undefined}])),market:keep};
            }else if(u.pathname==='/keys'){
              out=await env.IRYS_KV.list({prefix:PREFIX,limit:1000,...(u.searchParams.get('cursor')?{cursor:u.searchParams.get('cursor')}:{})});
            }else if(u.pathname==='/values'&&req.method==='POST'){
              const keys=(await req.json()).keys;
              if(!Array.isArray(keys)||keys.length>20||keys.some(k=>typeof k!=='string'||!k.startsWith(PREFIX)))return new Response('Invalid',{status:400});
              out=await Promise.all(keys.map(async k=>({event_key:k,event_ms:Number(k.split(':').at(-1)),value:JSON.parse(await env.IRYS_KV.get(k)||'null')})));
            }else return new Response('Not found',{status:404});
            const json=JSON.stringify(out,(k,v)=>/secret|token|chat_id|account_id|email|authorization/i.test(k)?undefined:v);
            return new Response(json,{headers:{'content-type':'application/json','cache-control':'no-store'}});
          }};
          // ${marker}`;
          // Mock authorization and prefix tests before ephemeral helper creation.
          const mod=await import('data:text/javascript;base64,'+Buffer.from(body).toString('base64'));
          let reads=0;const env={IRYS_KV:{get:async()=>{reads++;return '{}'},list:async()=>({keys:[],list_complete:true})}};
          assert.equal((await mod.default.fetch(new Request('https://example.test/state'),env)).status,404);
          assert.equal(reads,0);
          assert.equal((await mod.default.fetch(new Request('https://example.test/values',{method:'POST',headers:{authorization:'Bearer '+nonce},body:JSON.stringify({keys:['outside-prefix']})}),env)).status,400);
          assert.equal(reads,0);
          assert(!body.includes('.put(')&&!body.includes('sendMessage')&&!body.includes('scheduled('));
          const exists=await req(endpoint,{headers:auth});assert.equal(exists.status,404,'DO_NOT_OVERWRITE_EXISTING_HELPER');
          let created=false,deleted=false;let receiptCount=0;
          try{
            const form=new FormData();
            form.set('metadata',JSON.stringify({main_module:'worker.js',compatibility_date:'2026-10-01',bindings:[{name:'IRYS_KV',type:'kv_namespace',namespace_id:ns}]}));
            form.set('worker.js',new Blob([body],{type:'application/javascript+module'}),'worker.js');
            await cf(endpoint,{method:'PUT',body:form});created=true;
            await cf(endpoint+'/subdomain',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({enabled:true,previews_enabled:false})});
            const url='https://'+name+'.vhehwpfl.workers.dev';
            async function read(path,options={}){
              const r=await req(url+path,{...options,headers:{authorization:'Bearer '+nonce,'content-type':'application/json'}});
              assert(r.ok,'AUTHORIZED_HELPER_READ_HTTP_'+r.status);return r.json();
            }
            const state=await read('/state');save('state_market_only.json',state.market);save('state_inventory.json',state.inventory);
            const keys=[];let cursor;const seen=new Set();
            do{
              const page=await read('/keys'+(cursor?'?cursor='+encodeURIComponent(cursor):''));
              keys.push(...page.keys.map(k=>k.name));
              if(page.list_complete){cursor=null;break}
              cursor=page.cursor;assert(cursor&&!seen.has(cursor),'KV_PAGINATION_FAILED');seen.add(cursor);
            }while(cursor);
            const receipts=[];
            for(let i=0;i<keys.length;i+=20){
              const batch=await read('/values',{method:'POST',body:JSON.stringify({keys:keys.slice(i,i+20)})});
              for(const r of batch)if(r.value)receipts.push({...r.value,event_ms:r.event_ms,event_key:r.event_key});
            }
            receipts.sort((a,b)=>a.event_ms-b.event_ms);receiptCount=receipts.length;
            save('telegram_receipts.json',{read_at_ms:Date.now(),count:receipts.length,keys_listed:keys.length,pagination_exhausted:true,receipts});
            console.log('V27_REAL_RECEIPTS',JSON.stringify({count:receipts.length,channels:[...new Set(receipts.map(x=>x.channel))],latest:receipts.slice(-30)}));
          }finally{
            if(created){
              const current=await source(endpoint);assert(current.includes(Buffer.from(marker)),'HELPER_LEASE_MISMATCH');
              await cf(endpoint,{method:'DELETE'});
              const absent=await req(endpoint,{headers:auth});assert.equal(absent.status,404,'HELPER_DELETE_NOT_VERIFIED');deleted=true;
            }
            const after=await source(production);assert.equal(hash(after),hash(original),'ORIGINAL_PRODUCTION_SOURCE_CHANGED');
            const afterCron=await cf(production+'/schedules');assert.deepEqual(afterCron.result,cron.result,'ORIGINAL_CRON_CHANGED');
            save('source_receipt.json',{sha256:hash(original),bytes:original.length,production_unchanged:true,temporary_helper_created:created,temporary_helper_deleted:deleted,receipt_count:receiptCount});
            console.log('V27_ORIGINAL_UNCHANGED',JSON.stringify({sha256:hash(original),temporary_helper_created:created,temporary_helper_deleted:deleted,receipt_count:receiptCount}));
          }
          JS
      - name: Package public source even if external reads fail
        if: always()
        run: git archive --format=zip --output=v27_packet/public_source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v27-sanitized-source-and-actual-receipts
          path: v27_packet/
          if-no-files-found: error
          retention-days: 7
