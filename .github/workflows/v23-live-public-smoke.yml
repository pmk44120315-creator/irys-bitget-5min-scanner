name: IRYS V23 direct public exchange coverage live smoke
on:
  push:
    branches:
      - feature/irys-v23-direct-fast-scout-20261101
    paths:
      - '.github/workflows/v23-live-public-smoke.yml'
      - 'research/v23_direct_public_smoke.mjs'
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Fetch real direct Bithumb+Bitget public market source only
        run: |
          node --check research/v23_direct_public_smoke.mjs
          node research/v23_direct_public_smoke.mjs
