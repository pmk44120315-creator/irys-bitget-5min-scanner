name: V44 production recovery and actual-alert source audit
on:
  push:
    branches: [fix/irys-v44-runtime-outcomes-20261109]
    paths: ['.github/workflows/v44-recovery-review.yml']
permissions:
  contents: write
  actions: read
jobs:
  repair_audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce real production failure before changing source
        run: |
          mkdir -p v44_evidence
          set +e
          python -S -m unittest discover -s tests -v > v44_evidence/before.log 2>&1
          CODE=$?
          set -e
          test "$CODE" -ne 0
          grep -q "No module named 'yaml'" v44_evidence/before.log
          echo V44_REPRODUCED_PRODUCTION_DEPENDENCY_FAILURE
      - name: Isolate YAML-only verification without deleting any assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,shutil,hashlib
          checks={}
          for name in ['test_v43_workflow.py','test_v43_observation_workflow.py']:
            old=Path('tests')/name;raw=old.read_bytes();dest=Path('verification/workflows')/name
            dest.parent.mkdir(parents=True,exist_ok=True);shutil.move(old,dest)
            assert dest.read_bytes()==raw;checks[name]=hashlib.sha256(raw).hexdigest()
          p=Path('.github/workflows/v43-integration.yml');s=p.read_text()
          assert s.count("      - run: python -m pip install")==1
          s=s.replace("'tests/test_v43*',", "'tests/test_v43*','verification/workflows/**',")
          s=s.replace("      - run: python -m pip install", "      - name: Check production tests without installed third-party packages\n        run: python -S -m unittest discover -s tests -v\n      - run: python -m pip install",1)
          old='          python -m unittest discover -s tests -v 2>&1 | tee v43_verified/python.log'
          assert s.count(old)==1
          s=s.replace(old,'          python -S -m unittest discover -s tests -v 2>&1 | tee v43_verified/python.log\n          python -m unittest discover -s verification/workflows -v 2>&1 | tee v43_verified/workflow_tests.log')
          s=s.replace('HEAD deployment tests .github','HEAD deployment tests verification .github');p.write_text(s)
          p=Path('.github/v43_source_lease.json');m=json.loads(p.read_text())
          for name in ['test_v43_workflow.py','test_v43_observation_workflow.py']:m['verification/workflows/'+name]=m.pop('tests/'+name)
          p.write_text(json.dumps(m,indent=2)+'\n')
          Path('v44_evidence/config_assertions_preserved.json').write_text(json.dumps(checks,indent=2))
          PY
      - name: Verify real production environment and all relocated assertions
        run: |
          set -o pipefail
          python -S -m unittest discover -s tests -v 2>&1 | tee v44_evidence/production_after.log
          python -m pip install 'PyYAML==6.0.2'
          python -m unittest discover -s verification/workflows -v 2>&1 | tee v44_evidence/config_after.log
          node --test tests/test_v42_ack_feedback.mjs tests/test_v43*.mjs > v44_evidence/node_contracts.log
      - name: Commit only verified dependency-boundary repair to review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_v43_workflow.py tests/test_v43_observation_workflow.py verification/workflows/ .github/workflows/v43-integration.yml .github/v43_source_lease.json
          git diff --staged > v44_evidence/repair.patch
          git commit -m 'fix(V44): preserve YAML config checks outside stdlib production test discovery'
          git push origin HEAD:refs/heads/fix/irys-v44-runtime-outcomes-20261109
          git rev-parse HEAD > v44_evidence/verified_commit.txt
          git archive --format=zip --output=v44_evidence/source.zip HEAD
      - name: Audit actual server acknowledgements and subsequent official prices read only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          import {evaluateAckHistory} from './research/v42_actual_ack_evaluation.mjs';
          const repo='pmk44120315-creator/irys-bitget-5min-scanner',raw='https://raw.githubusercontent.com/'+repo;
          const get=async(url,auth=false)=>{const r=await fetch(url,{headers:{accept:'application/json','User-Agent':'IRYS-V44-readonly',...(auth?{authorization:'Bearer '+process.env.GITHUB_TOKEN}:{})},signal:AbortSignal.timeout(30000)});if(!r.ok)throw Error('HTTP_'+r.status);return r.json()};
          const save=(p,x)=>writeFileSync('v44_evidence/'+p,JSON.stringify(x,null,2));
          const h=await get('https://irys-surge-monitor.vhehwpfl.workers.dev/?v44readonly='+Date.now()),l=h.last||{},d=l.v30DirectionalDelivery||{},history=d.public_ack_history;
          save('health.json',{checked_at_utc:new Date().toISOString(),version:l.codeVersion,time:l.time,status:l.status,entry_enabled:h.marketNotificationsEnabled,risk_enabled:h.marketRiskWarningsEnabled,delivery_status:d.status,dispatch:d.dispatch_revalidation,feed:d.feed,history_records:history?.retained_ack_records,source_at_ms:d.source_at_ms,phone_delivery_verified:false});
          const old=await get(raw+'/data/irys-v39-ack-feedback/data/v42_actual_ack_evaluation.json');
          const result=await evaluateAckHistory({history,old,now:Date.now()});save('actual_ack_outcomes.json',result);save('public_ack_history.json',history);
          for(const [branch,file,out] of [['data/irys-v43-stream-evidence','v43_stream_latest.json','latest_stream.json'],['data/irys-v43-stream-evidence','v43_actual_quote_outcomes.json','actual_quote_outcomes.json'],['main','latest.json','collector_snapshot.json']])save(out,await get(raw+'/'+branch+'/data/'+file));
          const runs=await get('https://api.github.com/repos/'+repo+'/actions/workflows/v43-observation.yml/runs?per_page=10&status=success',true);
          save('stream_runs.json',runs.workflow_runs.map(x=>({id:x.id,created_at:x.created_at,head_sha:x.head_sha,status:x.status,conclusion:x.conclusion,url:x.html_url})));
          console.log('V44_ACTUAL_ALERT_AUDIT',JSON.stringify({diagnostics:result.diagnostics,summary:result.summary,recent:result.events.slice(-8).map(e=>({symbol:e.symbol,venue:e.venue,direction:e.direction,issued_at_ms:e.issued_at_ms,outcomes:e.outcomes}))}));
          JS
      - name: Hash original evidence and record failures without hiding them
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('v44_evidence');p.mkdir(exist_ok=True)
          d={str(f.relative_to(p)):{'bytes':f.stat().st_size,'sha256':hashlib.sha256(f.read_bytes()).hexdigest()} for f in p.rglob('*') if f.is_file()}
          (p/'manifest.json').write_text(json.dumps(d,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v44-recovery-and-actual-alert-evidence
          path: v44_evidence/
          retention-days: 30
          if-no-files-found: error
