name: IRYS V21 causal forecast contracts
on:
  push:
    branches: [feature/irys-v21-causal-forecast-20261031]
    paths:
      - .github/workflows/v21-causal-model-tests.yml
      - v21_forecast_core.py
      - v21_runtime.py
      - tests/test_v21_forecast_core.py
      - tests/test_v21_runtime.py
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_v21_*.py' -v
