name: IRYS V29 verified direction-review and notification safety release
on:
  push:
    branches: [fix/irys-v29-direction-doublecheck-20261103]
    paths: ['.github/workflows/v29-verified-quality-release.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: irys-v27-guarded-worker-source
  cancel-in-progress: false
jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: v28-1-production-and-natural-verification
          run-id: 41451593587
          github-token: ${{ github.token }}
          path: /tmp/v28_current
      - uses: actions/download-artifact@v4
        with:
          name: v28-production-and-natural-verification
          run-id: 41450016477
          github-token: ${{ github.token }}
          path: /tmp/v28_previous
      - name: Rebuild exact known sources without reading any private market state
        run: |
          mkdir -p v29_release
          git fetch --quiet --depth=1 origin release/irys-v24-bitget-fallback-20261101
          git show FETCH_HEAD:deployment/IRYS_V24_BITGET_FALLBACK_WORKER.mjs > /tmp/v24.mjs
          python deployment/build_v27_worker.py /tmp/v24.mjs deployment/IRYS_V27_RESPONSE_WORKER.mjs
          cp /tmp/v28_current/IRYS_V28_BUILDUP_WORKER.mjs deployment/IRYS_V28_BUILDUP_WORKER.mjs
          echo '932845cb6cf1949e453e52bbf6c75387820c6981fdb91ebc45b2e086a6fe176d  deployment/IRYS_V28_BUILDUP_WORKER.mjs' | sha256sum -c -
          python deployment/build_v29_worker.py deployment/IRYS_V28_BUILDUP_WORKER.mjs deployment/IRYS_V29_DIRECTION_REVIEW_WORKER.mjs
          echo '28dc5922e54f9e69d4a8150f03184417d0ea46409d82fe9130bbf648ac17309e  deployment/IRYS_V29_DIRECTION_REVIEW_WORKER.mjs' | sha256sum -c -
          node --check deployment/IRYS_V29_DIRECTION_REVIEW_WORKER.mjs
      - name: Entire original regression plus independent evidence and notification-block fault tests
        env:
          V27_BASE_WORKER: /tmp/v24.mjs
          V28_BASE_WORKER: deployment/IRYS_V27_RESPONSE_WORKER.mjs
          V28_RELEASE_BASE_WORKER: /tmp/v28_previous/IRYS_V28_BUILDUP_WORKER.mjs
          V29_BASE_WORKER: /tmp/v28_current/IRYS_V28_BUILDUP_WORKER.mjs
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee v29_release/python_tests.log
          node --test tests/*.mjs 2>&1 | tee v29_release/node_tests.log
      - name: Real independent public snapshots; do not send market messages or claim a winning model
        run: |
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';import assert from 'node:assert/strict';
          import {v29ReadSnapshot,v29RiskUniverse} from './deployment/v29_runtime.mjs';
          import {v29CheckPair,v29DeliveryPolicy} from './deployment/v29_direction_gate.mjs';
          const read=async u=>{const r=await fetch(u,{signal:AbortSignal.timeout(15000),headers:{accept:'application/json'}});if(!r.ok)throw Error('PUBLIC_HTTP_'+r.status);return r.json()};
          const candidates=[{venue:'bithumb',symbol:'KRW-EDGEX',direction:'BUY'},{venue:'bithumb',symbol:'KRW-MPLX',direction:'BUY'},{venue:'bitget',symbol:'BTCUSDT',direction:'LONG'}];
          const risks=await v29RiskUniverse(new Set(candidates.map(x=>x.venue)),read),first=[],result=[];
          for(const c of candidates){try{first.push(await v29ReadSnapshot(c,read));}catch(e){first.push({error:e.message});}}
          await new Promise(r=>setTimeout(r,8500));
          for(let i=0;i<candidates.length;i++){
            const c=candidates[i],a=first[i];
            if(a.error){result.push({candidate:c,error:a.error});continue;}
            try{const b=await v29ReadSnapshot(c,read);c.identity_verified=risks.valid.has(c.venue+':'+c.symbol);c.risk_checked=c.identity_verified;c.risk_flags=c.identity_verified?[]:['IDENTITY_OR_RISK_UNVERIFIED'];
              c.anchor_price=(a.quote.bid+a.quote.ask)/2;
              const check=v29CheckPair(c,a,b,Date.now());assert.equal(v29DeliveryPolicy(check).allowed,false);assert.equal(check.future_accuracy_proven,false);
              result.push({candidate:c,first:a,second:b,check,scope:'API_AND_CLOCK_SMOKE_NOT_A_PUBLISHED_SIGNAL'});
            }catch(e){result.push({candidate:c,error:e.message});}
          }
          writeFileSync('v29_release/public_sample_doublecheck.json',JSON.stringify({at_utc:new Date().toISOString(),results:result,no_orders:true,no_messages:true},null,2));
          console.log('V29_REAL_PUBLIC_PAIR_CHECK',JSON.stringify(result.map(x=>({symbol:x.candidate.symbol,status:x.check?.status,reason:x.check?.reason,error:x.error}))));
          assert(result.some(x=>x.first&&x.second),'NO_REAL_PUBLIC_SAMPLE_PAIR_OBTAINED');
          JS
      - name: Ordinary code-only guarded deployment; no private data export or diagnostic endpoint
        env:
          CF_ACCOUNT: ${{ secrets.IRYS_REALTIME_CF_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.IRYS_V7_CF_API_TOKEN }}
        run: node deployment/release_v29_guarded.mjs
      - name: Verify natural scheduled scan continues while unvalidated notifications remain disabled
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';import assert from 'node:assert/strict';
          const receipt=JSON.parse(readFileSync('v29_release/deployment.json','utf8'));
          const target=Math.ceil(Date.parse(receipt.at_utc)/300000)*300000,deadline=target+180000;
          const ms=s=>typeof s==='string'?Date.parse(s.replace(' KST','+09:00').replace(' ','T')):NaN;
          const reads=[];let health;
          do{
            const r=await fetch('https://irys-surge-monitor.vhehwpfl.workers.dev/?v29public='+Date.now(),{signal:AbortSignal.timeout(20000)});assert(r.ok,'PUBLIC_HEALTH_'+r.status);health=await r.json();
            const l=health.last||{};reads.push({at_utc:new Date().toISOString(),tick:l.time,version:l.codeVersion,status:l.status,notifications_enabled:health.marketNotificationsEnabled});
            if(l.codeVersion===receipt.version&&ms(l.time)>=target)break;
            if(Date.now()>=deadline)break;
            await new Promise(r=>setTimeout(r,10000));
          }while(Date.now()<=deadline);
          const l=health?.last||{},review=l.v29DirectionalReview||{};
          const proof={verified_at_utc:new Date().toISOString(),version:l.codeVersion,tick:l.time,status:l.status,
            market_notifications_enabled:health.marketNotificationsEnabled,quality_status:health.directionalQualityStatus,
            original_dispatch:l.githubDispatchStatus,market_coverage:l.v23DirectFastScout?.v28Discovery,
            paired_review:review,ack_this_tick:l.telegramApiAckedThisRun,last_public_ack:l.telegramLastApiReceipt,
            future_accuracy_improvement_proven:false,all_recent_private_alerts_audited:false,no_manual_scan_or_test_message:true};
          writeFileSync('v29_release/natural_health.json',JSON.stringify(health,null,2));
          writeFileSync('v29_release/natural_proof.json',JSON.stringify(proof,null,2));
          writeFileSync('v29_release/natural_reads.json',JSON.stringify(reads,null,2));
          console.log('V29_NATURAL_QUALITY_POLICY',JSON.stringify(proof));
          assert.equal(l.codeVersion,receipt.version);assert(ms(l.time)>=target,'NO_FULL_POST_RELEASE_TICK');assert.equal(l.status,'PASS');
          assert.equal(l.githubDispatchStatus,'ACCEPTED');assert.equal(health.marketNotificationsEnabled,false);assert.equal(l.telegramApiAckedThisRun,0);
          assert.equal(review.status,'RESEARCH_ONLY_NO_VALIDATED_FORECAST');assert.equal(review.telegram_enabled,false);assert.equal(review.sent,0);
          assert(l.v23DirectFastScout?.v28Discovery?.tracked>=100,'MARKET_TRACKING_STOPPED');
          JS
      - name: Preserve test, deployment and natural-runtime facts even on failure
        if: always()
        run: |
          mkdir -p v29_release
          test ! -f deployment/IRYS_V29_DIRECTION_REVIEW_WORKER.mjs || cp deployment/IRYS_V29_DIRECTION_REVIEW_WORKER.mjs v29_release/
          git archive --format=zip --output=v29_release/reviewed_source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v29-direction-quality-release-evidence
          path: v29_release/
          retention-days: 7
          if-no-files-found: error
