name: IRYS V27 guarded production executable-response upgrade
on:
  push:
    branches: [deploy/irys-v27-reviewed-worker-20261102]
    paths: ['.github/workflows/v27-guarded-release.yml','deployment/release_v27_guarded.mjs','tests/test_v27_release_guard.mjs']
permissions:
  contents: read
concurrency:
  group: irys-v27-guarded-worker-source
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build exact previously tested Worker source
        run: |
          git fetch --quiet --depth=1 origin release/irys-v24-bitget-fallback-20261101
          git show FETCH_HEAD:deployment/IRYS_V24_BITGET_FALLBACK_WORKER.mjs > /tmp/v24.mjs
          python deployment/build_v27_worker.py /tmp/v24.mjs deployment/IRYS_V27_RESPONSE_WORKER.mjs
          node --check deployment/release_v27_guarded.mjs
          echo 'a23035b6e36a61622424e5046e40d5fda85d76389ed778c9c954d175ea0454cd  deployment/IRYS_V27_RESPONSE_WORKER.mjs' | sha256sum -c -
      - name: Full regression plus source-lease and rollback fault tests before live changes
        env:
          V27_BASE_WORKER: /tmp/v24.mjs
        run: |
          python -m unittest discover -s tests -v
          node --test tests/*.mjs
      - name: Exact V24 lease, original bindings/Cron preservation, tested V27 upload and rollback guard
        env:
          CF_ACCOUNT: ${{ secrets.IRYS_REALTIME_CF_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.IRYS_V7_CF_API_TOKEN }}
        run: node deployment/release_v27_guarded.mjs
      - name: Preserve release proof and tested source
        if: always()
        run: |
          mkdir -p v27_deployment_receipt
          test ! -f deployment/IRYS_V27_RESPONSE_WORKER.mjs || cp deployment/IRYS_V27_RESPONSE_WORKER.mjs v27_deployment_receipt/
          git archive --format=zip --output=v27_deployment_receipt/tested_source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v27-guarded-production-release-proof
          path: v27_deployment_receipt/
          if-no-files-found: error
          retention-days: 7
