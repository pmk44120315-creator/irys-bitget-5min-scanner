name: IRYS V16 AI-first shadow research guarded code-only rollout ONCE
on:
  push:
    branches: [fix/irys-v16-ai-first-early-watch-20261030]
    paths:
      - 'deployment/IRYS_V16_AI_SHADOW_RELEASE_APPROVED_20261030.txt'
permissions:
  contents: read
concurrency:
  group: irys-surge-monitor-v14-release-once
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      IRYS_V7_CF_API_TOKEN: ${{ secrets.IRYS_V7_CF_API_TOKEN }}
      IRYS_REALTIME_CF_ACCOUNT_ID: ${{ secrets.IRYS_REALTIME_CF_ACCOUNT_ID }}
      IRYS_V14_RELEASE_ONCE: AUTHORIZED_FROM_REVIEWED_MARKER
      IRYS_V14_RELEASE_DRY_RUN: '0'
      IRYS_V14_EXPECTED_SHA256: '94b0c3936df5835cfa8a05fcdafe8647b4d9681a4fe8019c5cc9405b537e4535'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify reviewed immutable V16 research marker, no AI alert sending
        run: |
          grep -Fxq 'IRYS_V16_AI_SHADOW_RELEASE_APPROVED=USER_REQUEST_RECHECK_20261030' deployment/IRYS_V16_AI_SHADOW_RELEASE_APPROVED_20261030.txt
          grep -Fxq 'SOURCE_SHA256=94b0c3936df5835cfa8a05fcdafe8647b4d9681a4fe8019c5cc9405b537e4535' deployment/IRYS_V16_AI_SHADOW_RELEASE_APPROVED_20261030.txt
          test "$(sha256sum deployment/IRYS_V16_AI_FIRST_EARLY_WATCH_WORKER.mjs | cut -d' ' -f1)" = "$IRYS_V14_EXPECTED_SHA256"
          grep -Fq 'const AI_ALERT_TRANSPORT_ENABLED=false;' deployment/IRYS_V16_AI_FIRST_EARLY_WATCH_WORKER.mjs
      - name: Full isolated AI invocation and existing collector regressions
        run: |
          node --check deployment/IRYS_V16_AI_FIRST_EARLY_WATCH_WORKER.mjs
          node --check deployment/release-v16-ai-shadow-safe.mjs
          node --test tests/test_irys_v16_ai_first.mjs tests/test_irys_v15_telegram_proof.mjs
          python -m unittest discover -s tests -p 'test_*.py' -v
          python -m unittest discover -s ai_twin/tests -p 'test_*.py' -v
      - name: Lease prior V15 SHA, preserve bindings and 5m Cron, rollback on error
        run: node deployment/release-v16-ai-shadow-safe.mjs
