name: IRYS V17 passive post-release Cron verification
on:
  push:
    branches:
      - fix/irys-v17-causal-direction-vs-watch-20261030
    paths:
      - .github/workflows/verify-irys-v17-natural-cron-once.yml
permissions:
  contents: read
jobs:
  passive-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify natural scheduled V17 run; NO writes, messages, or manual triggers
        env:
          IRYS_REALTIME_CF_ACCOUNT_ID: ${{ secrets.IRYS_REALTIME_CF_ACCOUNT_ID }}
          IRYS_V7_CF_API_TOKEN: ${{ secrets.IRYS_V7_CF_API_TOKEN }}
        run: node deployment/v17-live-natural-cron-health.mjs
