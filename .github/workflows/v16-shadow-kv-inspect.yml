name: IRYS V16 read-only actual model decisions from scoped KV
on:
  push:
    branches: [fix/irys-v16-ai-first-early-watch-20261030]
    paths:
      - '.github/workflows/v16-shadow-kv-inspect.yml'
      - 'audits/v16_shadow_kv_get.mjs'
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    env:
      IRYS_V7_CF_API_TOKEN: ${{ secrets.IRYS_V7_CF_API_TOKEN }}
      IRYS_REALTIME_CF_ACCOUNT_ID: ${{ secrets.IRYS_REALTIME_CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read actual research candidate directions without KV writes or Telegram
        run: |
          node --check audits/v16_shadow_kv_get.mjs
          node audits/v16_shadow_kv_get.mjs
