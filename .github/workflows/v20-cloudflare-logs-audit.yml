name: IRYS V20 observability past V19 Telegram record read only
on:
  push:
    branches:
      - fix/irys-v20-accuracy-first-20261031
    paths:
      - .github/workflows/v20-cloudflare-logs-audit.yml
      - diagnostics/v20_cloudflare_real_receipts_readonly.mjs
permissions:
  contents: read
jobs:
  telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check diagnostics/v20_cloudflare_real_receipts_readonly.mjs
      - name: Query Cloudflare observability with existing read credentials only
        env:
          IRYS_REALTIME_CF_ACCOUNT_ID: ${{ secrets.IRYS_REALTIME_CF_ACCOUNT_ID }}
          IRYS_V7_CF_API_TOKEN: ${{ secrets.IRYS_V7_CF_API_TOKEN }}
        run: node diagnostics/v20_cloudflare_real_receipts_readonly.mjs
