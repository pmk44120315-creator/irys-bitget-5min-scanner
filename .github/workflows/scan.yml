name: Bitget five-minute read-only snapshot
on:
  # Cloudflare every-five-minute Cron dispatches this workflow.
  # No duplicate GitHub cron: avoid overlapping 2-4 minute full-market scans.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'collector.py'
      - 'tests/**'
      - '.github/workflows/scan.yml'
permissions:
  contents: write
concurrency:
  # Scanner and AI twin write separate files to the same main branch.
  # Use one cross-workflow lock so their commits cannot race.
  group: irys-bitget-main-writers
  cancel-in-progress: false
  queue: max
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      # Always resolve the live branch at START, not the SHA frozen when
      # workflow_dispatch was queued (a stale dispatch caused data rebase conflict).
      - uses: actions/checkout@v4
        with:
          ref: main
      # No local collector changes exist yet. Re-check remote now so a queued
      # 5m dispatch cannot start from a stale data/state or older source tree.
      - name: Verify and fast-forward to latest main before collecting
        run: |
          git fetch --quiet origin main
          git reset --hard origin/main
          echo "IRYS_CHECKOUT_BASE_SHA=$(git rev-parse HEAD)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check data integrity offline
        run: python -m unittest discover -s tests -v
      - name: Collect public Bitget market data
        id: scan
        continue-on-error: true
        run: python collector.py
      - name: Commit snapshot even when scan reports a failure
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json data/state.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'data: read-only 5m market snapshot'
          # The AI twin and occasional manual source updates can advance main
          # after checkout. Rebase only on current remote main; never force push.
          for attempt in 1 2 3 4 5 6; do
            git fetch --quiet origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo '::error::Concurrent update modified collector data. Refusing to overwrite newer snapshots.'
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          echo '::error::Snapshot push kept conflicting; no force push performed.'
          exit 1
      - name: Do not mark failed scans as success
        if: steps.scan.outcome == 'failure'
        run: exit 1
