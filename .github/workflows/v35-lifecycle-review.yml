name: IRYS V35 lifecycle and publication latency review (NO LIVE SEND)
on:
  push:
    branches: [fix/irys-v35-thesis-lifecycle-20261106]
    paths: ['.github/workflows/v35-lifecycle-review.yml','deployment/v35*.mjs','deployment/build_v35_worker.py','diagnostics/v35_apply.py','tests/test_v35*.mjs']
permissions:
  contents: write
  actions: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: v31-guarded-production-natural-proof
          run-id: 41814867318
          github-token: ${{ github.token }}
          path: /tmp/v31_original
      - uses: actions/download-artifact@v4
        with:
          name: v30-selective-production-natural-proof
          run-id: 41693577194
          github-token: ${{ github.token }}
          path: /tmp/v30_original
      - uses: actions/download-artifact@v4
        with:
          name: v28-production-and-natural-verification
          run-id: 41450016477
          github-token: ${{ github.token }}
          path: /tmp/v28_original
      - name: Apply exact migration and build original fixtures and reviewed source
        run: |
          mkdir -p v35_review
          python diagnostics/v35_apply.py
          git fetch --quiet --depth=1 origin release/irys-v24-bitget-fallback-20261101
          git show FETCH_HEAD:deployment/IRYS_V24_BITGET_FALLBACK_WORKER.mjs > /tmp/v24.mjs
          python deployment/build_v27_worker.py /tmp/v24.mjs deployment/IRYS_V27_RESPONSE_WORKER.mjs
          python deployment/build_v28_worker.py deployment/IRYS_V27_RESPONSE_WORKER.mjs deployment/IRYS_V28_BUILDUP_WORKER.mjs
          python deployment/build_v29_worker.py deployment/IRYS_V28_BUILDUP_WORKER.mjs deployment/IRYS_V29_DIRECTION_REVIEW_WORKER.mjs
          cp /tmp/v30_original/IRYS_V30_SELECTIVE_DIRECTION_WORKER.mjs deployment/
          cp /tmp/v31_original/IRYS_V31_TIMELY_WORKER.mjs deployment/
          python deployment/build_v34_worker.py deployment/IRYS_V31_TIMELY_WORKER.mjs deployment/IRYS_V34_CRASH_WARNING_WORKER.mjs
          python deployment/build_v35_worker.py deployment/IRYS_V34_CRASH_WARNING_WORKER.mjs deployment/IRYS_V35_LIFECYCLE_WORKER.mjs
          echo '728b2d14d3543b79040d810cbfe290dbb14c6edb3987ee5b2db4d96b0d9de881  deployment/IRYS_V34_CRASH_WARNING_WORKER.mjs' | sha256sum -c -
          echo 'b5835d9eb22d41f284ff55376790f6308799be5c1b74fcdb9fe5c01e1f3e27c1  deployment/IRYS_V35_LIFECYCLE_WORKER.mjs' | sha256sum -c -
      - name: Complete original and new regression, only mock Telegram adapter
        env:
          V27_BASE_WORKER: /tmp/v24.mjs
          V28_BASE_WORKER: deployment/IRYS_V27_RESPONSE_WORKER.mjs
          V28_RELEASE_BASE_WORKER: /tmp/v28_original/IRYS_V28_BUILDUP_WORKER.mjs
          V29_BASE_WORKER: deployment/IRYS_V28_BUILDUP_WORKER.mjs
          V30_BASE_WORKER: deployment/IRYS_V29_DIRECTION_REVIEW_WORKER.mjs
          V34_BASE_WORKER: deployment/IRYS_V31_TIMELY_WORKER.mjs
          V35_BASE_WORKER: deployment/IRYS_V34_CRASH_WARNING_WORKER.mjs
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee v35_review/python_tests.log
          node --test tests/*.mjs 2>&1 | tee v35_review/node_tests.log
      - name: Real current evidence before historical reads, never messages or orders
        run: |
          git fetch --quiet --depth=1 origin main
          git rev-parse origin/main > v35_review/frozen_main.txt
          for f in state.json v24_bitget_fast_latest.json v30_state.json; do git show "origin/main:data/$f" > "data/$f"; done
          set -o pipefail
          node deployment/v30_producer.mjs | tee v35_review/public_producer.log
          sha256sum data/v30_direction_latest.json > /tmp/v35_packet.sha
          node deployment/v35_history.mjs | tee v35_review/post_publication_history.log
          sha256sum -c /tmp/v35_packet.sha
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';import assert from 'node:assert/strict';
          import {v30ModelDigest} from './deployment/v30_producer.mjs';
          const d=JSON.parse(readFileSync('data/v30_direction_latest.json','utf8')),h=JSON.parse(readFileSync('data/v35_outcome_history.json','utf8'));
          assert.equal(d.model_digest,v30ModelDigest());assert.equal(d.model_digest,'057c9727163d43a9e10dc58b2581027df1b4679b5176a4e61ed81936ef073764');
          assert(d.summary.listed_spot>=100&&d.summary.listed_futures>=100);assert.equal(d.summary.evaluated,d.summary.selected);
          assert.equal(d.timing.history_reads_in_live_path,false);assert(Array.isArray(d.followups));
          assert.equal(h.live_packet_blocked,false);assert.equal(d.orders_sent,false);assert.equal(d.telegram_sent,false);
          const proof={at_ms:d.at_ms,summary:d.summary,timing:d.timing,followups:d.followups.length,history_pages:h.pages.length,history_errors:h.errors,live_packet_unchanged_by_history:true,forecast_accuracy_improvement_proven:false,no_live_messages_or_orders:true};
          writeFileSync('v35_review/public_proof.json',JSON.stringify(proof,null,2));console.log('V35_REAL_PUBLIC_PROOF',JSON.stringify(proof));
          JS
      - name: Publish only tested ordinary migration files to same feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --quiet origin fix/irys-v35-thesis-lifecycle-20261106
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git add deployment/v30_producer.mjs deployment/v30_delivery.mjs
          git commit -m 'fix(v35): verified signal lifecycle and nonblocking historical cache integration'
          git push origin HEAD:fix/irys-v35-thesis-lifecycle-20261106
          git rev-parse HEAD > v35_review/verified_commit.txt
      - name: Preserve exact source and all verification facts
        if: always()
        run: |
          mkdir -p v35_review
          test ! -f deployment/IRYS_V35_LIFECYCLE_WORKER.mjs || cp deployment/IRYS_V35_LIFECYCLE_WORKER* v35_review/
          test ! -f data/v30_direction_latest.json || cp data/v30_direction_latest.json v35_review/
          test ! -f data/v35_outcome_history.json || cp data/v35_outcome_history.json v35_review/
          git archive --format=zip --output=v35_review/reviewed_source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v35-reviewed-lifecycle-publication
          path: v35_review/
          retention-days: 7
          if-no-files-found: error
