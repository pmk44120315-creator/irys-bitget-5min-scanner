name: IRYS realtime isolated short live SHADOW proof (auto-stop, no alert)
on:
  push:
    branches: [research/realtime-orderbook-ws-20261028]
    paths:
      - '.github/workflows/irys-rt-short-live-proof.yml'
permissions:
  contents: read
concurrency:
  group: isolated-irys-realtime-evidence-short-proof
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.IRYS_REALTIME_CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.IRYS_REALTIME_CF_ACCOUNT_ID }}
      CLOUDFLARE_SEND_METRICS: "false"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify isolated service deployment and public health
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN}" && -n "${CLOUDFLARE_ACCOUNT_ID}" ]] || exit 1
          curl --silent --show-error --fail --max-time 20 https://irys-realtime-evidence.vhehwpfl.workers.dev/health -o /tmp/rt_prehealth
          node -e 'const d=JSON.parse(require("fs").readFileSync("/tmp/rt_prehealth","utf8")); if(d.version!=="IRYS_REALTIME_SHADOW_V1"||d.trade_alerts_enabled!==false)process.exit(2); console.log("HEALTH_PASS: isolated SHADOW only");'
      - name: Install isolated admin secret; verify one real WebSocket session; always stop
        shell: bash
        run: |
          set -euo pipefail
          URL="https://irys-realtime-evidence.vhehwpfl.workers.dev"
          ADMIN="$(node -e 'const c=require("node:crypto");const k=process.env.CLOUDFLARE_API_TOKEN;if(!k||k.length<16)process.exit(2);process.stdout.write(c.createHmac("sha256",k).update("irys-realtime-evidence/admin-control/v1").digest("hex"));')"
          if [[ "${#ADMIN}" != 64 ]]; then echo "::error::Admin secret derivation failed"; exit 2; fi
          # Store separate nonreversible per-app secret, NEVER reusing the Cloudflare API token as Bearer.
          printf "%s" "$ADMIN" | npx --yes wrangler@4.154.0 secret put IRYS_RT_ADMIN_TOKEN --config realtime_research/service/wrangler.jsonc >/tmp/rt-secret-put
          echo "ADMIN_SECRET_PASS: scope-limited Worker secret configured (value never logged)"
          START_ATTEMPTED=0
          stop_shadow() {
            local prior=$?
            if [[ "$START_ATTEMPTED" == "1" ]]; then
              local code
              code=$(curl --silent --show-error --max-time 20 -o /tmp/rt-stop -w "%{http_code}" -X POST -H "Authorization: Bearer ${ADMIN}" "${URL}/control/stop" || true)
              if [[ "$code" == "200" ]]; then echo "STOP_REQUEST_HTTP_200"; else echo "::error::STOP_UNVERIFIED_HTTP_${code}"; fi
              if [[ "$code" != "200" && "$prior" == "0" ]]; then return 1; fi
            fi
            return "$prior"
          }
          trap stop_shadow EXIT
          CODE=$(curl --silent --show-error --max-time 30 -o /tmp/rt-start -w "%{http_code}" -X POST -H "Authorization: Bearer ${ADMIN}" -H "Content-Type: application/json" --data '{"markets":["KRW-WLD"]}' "${URL}/control/start")
          START_ATTEMPTED=1
          if [[ "$CODE" != "200" ]]; then echo "::error::START_HTTP_${CODE}"; cat /tmp/rt-start; exit 1; fi
          node -e 'const d=JSON.parse(require("fs").readFileSync("/tmp/rt-start","utf8"));console.log("START_RESULT",JSON.stringify(d));if(!d.enabled||!d.connected||d.live_trade_alerts_enabled!==false)process.exit(2);'
          NOW="$(date -u +%s)"
          WAIT=$(( 60 - NOW % 60 + 68 ))
          echo "SHORT_LIVE_SHADOW_WINDOW_SECONDS=${WAIT}; no orders, no Telegram"
          sleep "$WAIT"
          CODE=$(curl --silent --show-error --max-time 30 -o /tmp/rt-status -w "%{http_code}" -H "Authorization: Bearer ${ADMIN}" "${URL}/status")
          if [[ "$CODE" != "200" ]]; then echo "::error::STATUS_HTTP_${CODE}"; exit 1; fi
          CODE=$(curl --silent --show-error --max-time 30 -o /tmp/rt-evidence -w "%{http_code}" -H "Authorization: Bearer ${ADMIN}" "${URL}/evidence")
          if [[ "$CODE" != "200" ]]; then echo "::error::EVIDENCE_HTTP_${CODE}"; exit 1; fi
          node <<'JS'
          const fs=require("fs");
          const st=JSON.parse(fs.readFileSync("/tmp/rt-status","utf8"));
          const ev=JSON.parse(fs.readFileSync("/tmp/rt-evidence","utf8"));
          if(!st.enabled||st.live_trade_alerts_enabled!==false||!Array.isArray(ev.windows))process.exit(3);
          console.log("SHADOW_REAL_STATUS",JSON.stringify({enabled:st.enabled,connection:st.connection,markets:st.markets}));
          console.log("SHADOW_REAL_EVIDENCE",JSON.stringify(ev.windows.map(x=>({market:x.market,minutes:x.minutes,verified:x.verified,reasons:x.reasons,trade_count:x.trade_count,book_seconds:x.book_seconds,matched_minutes:x.matched_minutes,net_buy_krw:x.net_buy_krw,send_allowed:x.send_allowed}))));
          JS
          # Trap sends STOP and checks receipt even if any assertion failed.
