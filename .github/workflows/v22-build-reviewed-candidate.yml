name: IRYS V22 reviewed reproducible adaptive build
on:
  push:
    branches: [upgrade/irys-v22-performance-20261101]
    paths: [.github/workflows/v22-build-reviewed-candidate.yml]
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-v22.txt
      - run: python -m pip install -r requirements-v22.txt
      - uses: actions/download-artifact@v4
        with:
          name: v22-pinned-source-and-causal-evidence
          run-id: 41222723069
          github-token: ${{ github.token }}
          path: /tmp/v22/source
      - uses: actions/download-artifact@v4
        with:
          name: v22-official-exact-minute-targets
          run-id: 41223713523
          github-token: ${{ github.token }}
          path: /tmp/v22/bitget
      - uses: actions/download-artifact@v4
        with:
          name: v22-bithumb-kst-exact-targets
          run-id: 41225184803
          github-token: ${{ github.token }}
          path: /tmp/v22/bithumb
      - name: Verify pinned feature archive integrity
        run: |
          python - <<'PY'
          import pathlib,json,hashlib
          root=pathlib.Path('/tmp/v22/source')
          manifest=json.loads((root/'manifest.json').read_text())
          for name,value in manifest.items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==value,name
          print('V22_ARCHIVE_HASHES_VERIFIED',json.dumps(manifest))
          PY
      - name: Full legacy and V22 causal regression
        run: |
          python -m unittest discover -s tests -v
          node --test tests/test_v21_delivery.mjs tests/test_v21_report_timing.mjs tests/test_v21_forecast_expiry.mjs tests/test_v22_delivery.mjs
      - name: Reproduce selected initial models from public price records
        run: python research/v22_build_seeds.py /tmp/v22/source/replay.json.gz /tmp/v22/bitget/exact-prices.json.gz /tmp/v22/bithumb/exact-prices.json.gz
      - name: Build exact Worker while preserving original source
        run: |
          node deployment/build_v22_worker.mjs
          node --check deployment/IRYS_V22_ADAPTIVE_WORKER.mjs
          python -m py_compile v22_live.py v22_tree.py v22_learning.py v22_performance.py
      - name: Preserve verified generated files on development branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/v22_results/seeds.json research/v22_results/seed_receipt.json deployment/IRYS_V22_ADAPTIVE_WORKER.mjs deployment/v22_candidate.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'build(v22): verified public-data seeds and exact Worker candidate; no production deployment'
          git fetch origin upgrade/irys-v22-performance-20261101
          git rebase origin/upgrade/irys-v22-performance-20261101
          git push origin HEAD:upgrade/irys-v22-performance-20261101
      - uses: actions/upload-artifact@v4
        with:
          name: v22-reviewed-model-and-worker
          path: |
            research/v22_results/
            deployment/v22_candidate.json
          retention-days: 14
