name: IRYS Bithumb mover-audit no-alert regression
on:
  push:
    branches: [fix/irys-spot-rally-prescreen-audit-20261028]
    paths:
      - 'spot_flow.py'
      - 'tests/test_spot_prescreen_audit.py'
      - '.github/workflows/verify-spot-prescreen-audit.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source syntax and collector plus new no-alert diagnostics
        run: |
          python -m py_compile collector.py spot_flow.py spot_continuity.py
          python -m unittest discover -s tests -p 'test_*.py' -v
