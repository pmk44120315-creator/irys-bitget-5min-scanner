name: IRYS V31 public actual-ACK and direction-latency audit (NO SEND)
on:
  push:
    branches: [fix/irys-v31-latency-quality-20261104]
    paths: ['.github/workflows/v31-outcome-latency-audit.yml']
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze current publicly published source and forward records
        run: |
          mkdir -p v31_audit
          git fetch --quiet --depth=1 origin main
          git show origin/main:data/v30_state.json > v31_audit/v30_state.json
          git show origin/main:data/v30_direction_latest.json > v31_audit/v30_latest.json
          git archive --format=zip --output=v31_audit/current_source.zip origin/main
          echo "V31_AUDIT_MAIN_SHA=$(git rev-parse origin/main)"
      - name: Public live health, real published prospective outcomes and latest public ACK only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,pathlib,urllib.request,urllib.parse,datetime as dt,time,collections,statistics,os
          p=pathlib.Path('v31_audit');KST=dt.timezone(dt.timedelta(hours=9));now=int(time.time()*1000)
          def get(url,auth=False):
              headers={'accept':'application/json','User-Agent':'IRYS-readonly-public-audit','cache-control':'no-cache'}
              if auth:headers['authorization']='Bearer '+os.environ['GH_TOKEN']
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as r:return json.load(r)
          def save(name,obj):(p/name).write_text(json.dumps(obj,ensure_ascii=False,indent=2),encoding='utf8')
          h=get('https://irys-surge-monitor.vhehwpfl.workers.dev/?public_audit='+str(time.time_ns()));save('health.json',h)
          last=h.get('last') or {};delivery=last.get('v30DirectionalDelivery') or {};receipt=last.get('telegramLastApiReceipt') or {}
          state=json.loads((p/'v30_state.json').read_text());latest=json.loads((p/'v30_latest.json').read_text());rows=state.get('records') or []
          metrics={}
          for venue,direction in [('bithumb','BUY'),('bitget','LONG'),('bitget','SHORT')]:
              for quality in ['READY_CURRENT_EVIDENCE','NOT_READY']:
                  subset=[r for r in rows if r.get('venue')==venue and r.get('direction')==direction and r.get('evidence_status')==quality]
                  out={}
                  for horizon in [5,15,30,60]:
                      outcomes=[r.get('outcomes',{}).get(str(horizon)) for r in subset]
                      measured=[x for x in outcomes if x and x.get('status')=='MEASURED_PUBLIC_QUOTE']
                      out[str(horizon)]={'events':len(subset),'measured':len(measured),'missing':sum(bool(x and x.get('status')=='UNMEASURED_TARGET_QUOTE') for x in outcomes),'pending':sum(x is None for x in outcomes),'gross_positive':sum(x['gross_quote_pct']>0 for x in measured),'net_positive':sum(x['net_scenario_pct']>0 for x in measured),'mean_gross_pct':statistics.fmean(x['gross_quote_pct'] for x in measured) if measured else None,'mean_net_scenario_pct':statistics.fmean(x['net_scenario_pct'] for x in measured) if measured else None}
                  metrics[venue+':'+direction+':'+quality]=out
          ready=[r for r in rows if r.get('evidence_status')=='READY_CURRENT_EVIDENCE'];save('public_ready_hypotheses.json',ready)
          packet_timings=[]
          for item in latest.get('items',[]):
              a=item.get('first') or {};b=item.get('second') or {};q=item.get('final') or {};c=item.get('candidate') or {}
              packet_timings.append({'venue':c.get('venue'),'symbol':c.get('symbol'),'direction':c.get('direction'),'discover_change_pct':c.get('change_pct'),'pair_gap_ms':b.get('observed_at_ms',0)-a.get('observed_at_ms',0),'final_after_second_ms':q.get('observed_at_ms',0)-b.get('observed_at_ms',0),'report_after_final_ms':latest['at_ms']-q.get('quote',{}).get('at_ms',latest['at_ms'])})
          runs=get('https://api.github.com/repos/pmk44120315-creator/irys-bitget-5min-scanner/actions/runs?per_page=80',True)
          relevant=[{'id':r['id'],'name':r['name'],'status':r['status'],'conclusion':r['conclusion'],'created_at':r['created_at'],'started_at':r['run_started_at'],'updated_at':r['updated_at']} for r in runs['workflow_runs'] if r['name'] in ['IRYS V30 official paired directional evidence (NO MESSAGES)','Bitget five-minute read-only snapshot']]
          save('runs.json',relevant)
          summary={'at_kst':dt.datetime.now(KST).isoformat(),'current_version':last.get('codeVersion'),'last_tick':last.get('time'),'status':last.get('status'),'current_delivery':delivery,'latest_public_ack':receipt,'actual_alert_aggregate':delivery.get('actual_alert_outcomes'),'total_public_forecast_records':len(rows),'ready_public_forecasts':len(ready),'public_forecasts_are_not_actual_sent_alerts':True,'prospective_metrics':metrics,'source_packet_ms':latest['at_ms']-latest['started_at_ms'],'packet_timing':packet_timings,'private_telegram_inventory_accessed':False,'current_message_list_complete':False,'code_or_production_changed':False}
          save('summary.json',summary);print('V31_PUBLIC_AUDIT_SUMMARY',json.dumps(summary,ensure_ascii=False))
          # Only the last ACK header is publicly accessible. Never invent its body,
          # direction or claim the public research rows were sent to Telegram.
          if receipt.get('symbol'):
              symbol=receipt['symbol'];stamp=receipt.get('ack_received_at_ms') or receipt.get('recorded_send_ms')
              if not isinstance(stamp,int):stamp=int(dt.datetime.fromisoformat(receipt['accepted_at'].replace(' KST','+09:00').replace(' ','T')).timestamp()*1000)
              direction=delivery.get('direction') if delivery.get('message_id')==receipt.get('telegram_message_id') else None
              ref=(stamp//60000+1)*60000;end=min(now//60000*60000,ref+61*60000)
              if symbol.startswith('KRW-'):
                  to=dt.datetime.fromtimestamp(end/1000,KST).strftime('%Y-%m-%dT%H:%M:%S');venue='bithumb'
                  url='https://api.bithumb.com/v1/candles/minutes/1?'+urllib.parse.urlencode({'market':symbol,'to':to,'count':200})
              else:
                  venue='bitget';url='https://api.bitget.com/api/v2/mix/market/history-candles?'+urllib.parse.urlencode({'symbol':symbol,'productType':'USDT-FUTURES','granularity':'1m','endTime':end,'limit':200})
              raw=get(url);save('latest_actual_ack_candles.json',{'receipt':receipt,'direction_confirmed':direction,'stamp_ms':stamp,'reference_ms':ref,'source_url':url,'raw':raw})
              from v27_alert_audit import parse_bars,evaluate
              raw=raw['data'] if venue=='bitget' and raw.get('code')=='00000' else raw
              bars=parse_bars(raw,venue,now)
              result={'symbol':symbol,'time_kst':receipt.get('accepted_at'),'direction_confirmed':direction,'method':'FIRST_FULL_POST_ACK_MINUTE_OPEN; NOT_FILL','horizons':{str(n):evaluate(dict(receipt,event_ms=stamp,direction=direction),bars,n,now) for n in [5,15,30,60]}}
              save('latest_actual_ack_outcomes.json',result);print('V31_LATEST_PUBLIC_ACK_OUTCOME',json.dumps(result,ensure_ascii=False))
          print('V31_PUBLIC_READ_ONLY_NO_PRIVATE_KV_ACCESS_NO_MESSAGES_NO_ORDERS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v31-public-outcome-latency-evidence
          path: v31_audit/
          retention-days: 7
          if-no-files-found: error
