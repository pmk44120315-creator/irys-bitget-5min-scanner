name: V46 native-context repair and full regression (NO DEPLOY)
on:
  push:
    branches: [fix/irys-v46-full-audit-20261110]
    paths: ['deployment/v45_rsi_context.mjs','deployment/build_v46*.py','research/v46*.mjs','tests/test_v46*.mjs','verification/v46/**','.github/workflows/v46-verify.yml','.github/workflows/v46-quality.yml']
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin exact locally tested source bytes
        run: |
          mkdir -p v46_verified
          cat <<'SUMS' | sha256sum -c -
          647d9d985ae00a908fc59daa784889192a03b70f901ce1736dac7717f0ecfd8e  deployment/v45_rsi_context.mjs
          e25b0861d9df653ebcdb90b7d12086bacd1f9f292c20791c3e2c93c1c132886f  deployment/build_v46_worker.py
          ce0b3e4d17bf2422dc857bda2f42013ff5558dbe9f440f22e880b6c1de5386d2  deployment/build_v46_release_guard.py
          10e1d95a600396cc99d743c048264b43e8e49d2060f54cfbfdd7e9faf567ffad  research/v46_actual_quality.mjs
          5ee458117cdb724ceb7f6c8e1c9b91e203cf13bc939fb223b63bbaedf7b4c891  tests/test_v46_actual_quality.mjs
          a04c3ddd483e704077b442ca3bbcec75a05cc09d16b94c576e01e500a4d79429  verification/v46/test_v46_rsi_sparse.mjs
          993964611d15120fc1ad9c2341db524d18aa2938a6faf746c7305d9d2070807b  verification/v46/test_v46_worker.mjs
          dd38ab481174f192f819b90e64e2ddaa0322733dd1c11ee435e448afbb630e88  verification/v46/test_v46_release_guard.mjs
          SUMS
          python -S -m unittest discover -s tests -v > v46_verified/python_stdlib.log 2>&1
      - run: python -m pip install 'numpy==2.3.5' 'scikit-learn==1.8.0' 'PyYAML==6.0.2'
      - uses: actions/download-artifact@v4
        with:
          name: v45-resumed-live-deployment-proof
          run-id: 42564939375
          github-token: ${{ github.token }}
          path: /tmp/v45
      - uses: actions/download-artifact@v4
        with:
          name: v46-native-rsi-diagnosis
          run-id: 42642722251
          github-token: ${{ github.token }}
          path: /tmp/native
      - uses: actions/download-artifact@v4
        with:
          name: v421-transport-verified-proof
          run-id: 42466573774
          github-token: ${{ github.token }}
          path: /tmp/v421
      - uses: actions/download-artifact@v4
        with:
          name: v42-live-dispatch-upgrade-proof
          run-id: 42459877506
          github-token: ${{ github.token }}
          path: /tmp/v42
      - uses: actions/download-artifact@v4
        with:
          name: v351-delivery-first-production-proof
          run-id: 42156639897
          github-token: ${{ github.token }}
          path: /tmp/v351
      - uses: actions/download-artifact@v4
        with:
          name: v35-deployed-natural-proof
          run-id: 42083867409
          github-token: ${{ github.token }}
          path: /tmp/v35
      - uses: actions/download-artifact@v4
        with:
          name: v31-guarded-production-natural-proof
          run-id: 41814867318
          github-token: ${{ github.token }}
          path: /tmp/v31
      - uses: actions/download-artifact@v4
        with:
          name: v30-selective-production-natural-proof
          run-id: 41693577194
          github-token: ${{ github.token }}
          path: /tmp/v30
      - uses: actions/download-artifact@v4
        with:
          name: v28-production-and-natural-verification
          run-id: 41450016477
          github-token: ${{ github.token }}
          path: /tmp/v28
      - name: Restore unchanged old compiled fixtures and build exact V46 candidate
        run: |
          git fetch --quiet --depth=1 origin release/irys-v24-bitget-fallback-20261101
          git show FETCH_HEAD:deployment/IRYS_V24_BITGET_FALLBACK_WORKER.mjs > /tmp/v24.mjs
          python deployment/build_v27_worker.py /tmp/v24.mjs deployment/IRYS_V27_RESPONSE_WORKER.mjs
          python deployment/build_v28_worker.py deployment/IRYS_V27_RESPONSE_WORKER.mjs deployment/IRYS_V28_BUILDUP_WORKER.mjs
          python deployment/build_v29_worker.py deployment/IRYS_V28_BUILDUP_WORKER.mjs deployment/IRYS_V29_DIRECTION_REVIEW_WORKER.mjs
          cp /tmp/v30/IRYS_V30_SELECTIVE_DIRECTION_WORKER.mjs deployment/
          cp /tmp/v31/IRYS_V31_TIMELY_WORKER.mjs deployment/
          python deployment/build_v34_worker.py deployment/IRYS_V31_TIMELY_WORKER.mjs deployment/IRYS_V34_CRASH_WARNING_WORKER.mjs
          cp /tmp/v35/IRYS_V35_LIFECYCLE_WORKER.mjs deployment/
          cp /tmp/v351/IRYS_V351_DELIVERY_FIRST_WORKER.mjs deployment/
          cp /tmp/v42/IRYS_V42_DISPATCH_WORKER.mjs deployment/
          cp /tmp/v421/IRYS_V421_DISPATCH_WORKER.mjs deployment/
          cp /tmp/v45/IRYS_V45_RSI_WORKER.mjs deployment/
          cp /tmp/v45/release_v45_guarded.mjs deployment/
          python deployment/build_v46_worker.py deployment/IRYS_V45_RSI_WORKER.mjs deployment/IRYS_V46_CONTEXT_WORKER.mjs
          python deployment/build_v46_release_guard.py deployment/release_v45_guarded.mjs deployment/release_v46_guarded.mjs
          echo '9979d4c357cbb520c4cc8f2c68b55adf93264b53d992c9c3562c82b2e1ca8bc4  deployment/IRYS_V46_CONTEXT_WORKER.mjs' | sha256sum -c -
          echo 'e4c51066074898e8bd0eae5afec886fdb87f0ca72d501c2967a8cd72f0a2c6a9  deployment/release_v46_guarded.mjs' | sha256sum -c -
          node --check deployment/IRYS_V46_CONTEXT_WORKER.mjs
          python - <<'PY'
          from pathlib import Path
          import json
          out=Path('verification/v46/fixtures');out.mkdir(parents=True,exist_ok=True)
          for f in Path('/tmp/native').glob('original_*.json'):
            d=json.loads(f.read_text());e=d['evaluation']
            if e['source_packet_at_ms']==e['batch_packet_at_ms'] and e['published_before_ack']:
              row={'ack':d['ack'],'batch':d['context_batch'],'publication_sha':e['publication_sha'],'published_at':e['commit_at']}
              (out/(d['ack']['symbol']+'_original.json')).write_text(json.dumps(row,separators=(',',':')))
          assert (out/'KRW-RSR_original.json').is_file() and (out/'KRW-MERL_original.json').is_file()
          PY
      - name: Full regression and causal/compiled/rollback contracts
        env:
          V27_BASE_WORKER: /tmp/v24.mjs
          V28_BASE_WORKER: deployment/IRYS_V27_RESPONSE_WORKER.mjs
          V28_RELEASE_BASE_WORKER: /tmp/v28/IRYS_V28_BUILDUP_WORKER.mjs
          V29_BASE_WORKER: deployment/IRYS_V28_BUILDUP_WORKER.mjs
          V30_BASE_WORKER: deployment/IRYS_V29_DIRECTION_REVIEW_WORKER.mjs
          V34_BASE_WORKER: deployment/IRYS_V31_TIMELY_WORKER.mjs
          V35_BASE_WORKER: deployment/IRYS_V34_CRASH_WARNING_WORKER.mjs
        run: |
          set -o pipefail
          python -m unittest discover -s verification/workflows -v 2>&1 | tee v46_verified/workflow_tests.log
          python -m unittest discover -s research/tests -p 'test_v40*.py' -v 2>&1 | tee v46_verified/learning_tests.log
          node --test tests/*.mjs verification/v45/*.mjs verification/v46/*.mjs 2>&1 | tee v46_verified/node_tests.log
      - name: Read current real ACK performance without changing source ledgers
        run: |
          git fetch --quiet --depth=1 origin data/irys-v39-ack-feedback
          git show FETCH_HEAD:data/v42_actual_ack_evaluation.json > data/v42_actual_ack_evaluation.json
          git fetch --quiet --depth=1 origin data/irys-v43-stream-evidence
          git show FETCH_HEAD:data/v43_actual_quote_outcomes.json > data/v43_actual_quote_outcomes.json
          node research/v46_actual_quality.mjs
          cp v46_quality/v46_actual_quality.json v46_verified/
      - name: Preserve exact code and all success/failure evidence
        if: always()
        run: |
          mkdir -p v46_verified
          git rev-parse HEAD > v46_verified/source_commit.txt
          git archive --format=zip --output=v46_verified/source.zip HEAD
          if test -f deployment/IRYS_V46_CONTEXT_WORKER.mjs; then cp deployment/IRYS_V46_CONTEXT_WORKER.* v46_verified/; fi
          if test -f deployment/release_v46_guarded.mjs; then cp deployment/release_v46_guarded.mjs v46_verified/; fi
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          p=Path('v46_verified');m={str(f.relative_to(p)):{'bytes':f.stat().st_size,'sha256':hashlib.sha256(f.read_bytes()).hexdigest()} for f in p.rglob('*') if f.is_file()}
          (p/'manifest.json').write_text(json.dumps(m,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v46-verified-build-and-quality
          path: v46_verified/
          retention-days: 30
          if-no-files-found: error
