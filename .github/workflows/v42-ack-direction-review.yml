name: IRYS V42 actual ACK and direction repair verification
on:
  push:
    branches: [fix/irys-v42-ack-direction-review-20261108]
    paths: ['.github/workflows/v42-ack-direction-review.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Snapshot current public source and actual ACK ledger
        run: |
          mkdir -p v42_audit/data v42_audit/packets
          git rev-parse HEAD > v42_audit/source_commit.txt
          git archive --format=zip --output=v42_audit/source.zip HEAD
          for f in v22_evidence_state.json v22_evidence_latest.json v36_shadow_state.json v36_shadow_latest.json v37_early_latest.json v38_continuation_latest.json; do
            cp data/$f v42_audit/data/$f
          done
          git fetch --quiet --depth=1 origin data/irys-v39-ack-feedback
          git rev-parse FETCH_HEAD > v42_audit/ack_ledger_commit.txt
          git show FETCH_HEAD:data/v39_ack_feedback.json > v42_audit/data/v39_ack_feedback.json
      - name: Read public Worker health and independently replay each actual recorded ACK
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {replay,validateAckSource,parseBars,markOutcomes} from './research/v39_latest_ack_replay.mjs';
          const now=Date.now(),ledger=JSON.parse(readFileSync('v42_audit/data/v39_ack_feedback.json'));
          const result={asof_ms:now,mode:'READ_ONLY',health:null,cases:[],errors:[],phone_delivery_verified:false};
          try{
            const r=await fetch('https://irys-surge-monitor.vhehwpfl.workers.dev/?v42readonly='+now,{signal:AbortSignal.timeout(20000)});
            if(!r.ok)throw Error('HTTP_'+r.status);
            const h=await r.json(),l=h.last||{},d=l.v30DirectionalDelivery||{},ack=l.telegramLastApiReceipt||{};
            result.health={http:r.status,code_version:l.codeVersion,time:l.time,status:l.status,keys:Object.keys(h),last_keys:Object.keys(l),delivery_keys:Object.keys(d),
              entry_notifications_enabled:h.marketNotificationsEnabled,delivery_status:d.status,feed:d.feed,
              actual_alert_outcomes:d.actual_alert_outcomes,last_api_ack_symbol:ack.symbol,last_api_ack_ms:ack.ack_received_at_ms??ack.recorded_send_ms,
              ack_count:l.telegramApiAckedThisRun};
          }catch(e){result.errors.push({stage:'HEALTH',error:String(e.message).slice(0,120)});}
          const keys=new Set(ledger.events.map(e=>e.symbol+':'+e.ack_at_ms));
          if(result.health?.last_api_ack_ms&&!keys.has(result.health.last_api_ack_symbol+':'+result.health.last_api_ack_ms))
            ledger.events.push({symbol:result.health.last_api_ack_symbol,ack_at_ms:result.health.last_api_ack_ms});
          for(const event of ledger.events){
            try{
              const fresh=await replay({ack:{last_api_ack_ms:event.ack_at_ms,last_api_ack_symbol:event.symbol},snapshotAtMs:now,githubToken:process.env.GITHUB_TOKEN});
              const sha=event.source_commit||fresh.source_commit;
              let source=null,source_match=null;
              if(sha){
                const r=await fetch('https://raw.githubusercontent.com/pmk44120315-creator/irys-bitget-5min-scanner/'+sha+'/data/v30_direction_latest.json',{signal:AbortSignal.timeout(20000)});
                if(!r.ok)throw Error('SOURCE_HTTP_'+r.status);source=await r.json();source_match=validateAckSource(source,event.ack_at_ms,event.symbol);
                writeFileSync('v42_audit/packets/'+event.symbol+'_'+event.ack_at_ms+'.json',JSON.stringify(source));
              }
              result.cases.push({event,fresh,source_match:source_match!==null});
            }catch(e){result.errors.push({symbol:event.symbol,ack_at_ms:event.ack_at_ms,error:String(e.message).slice(0,160)});}
          }
          writeFileSync('v42_audit/actual_ack_audit.json',JSON.stringify(result,null,2));
          console.log('V42_ACTUAL_ACK_AUDIT',JSON.stringify(result));
          JS
      - name: Hash evidence
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('v42_audit');d={str(f.relative_to(p)):{'bytes':f.stat().st_size,'sha256':hashlib.sha256(f.read_bytes()).hexdigest()} for f in p.rglob('*') if f.is_file()}
          (p/'manifest.json').write_text(json.dumps(d,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v42-actual-ack-source-audit
          path: v42_audit/
          retention-days: 30
          if-no-files-found: error
