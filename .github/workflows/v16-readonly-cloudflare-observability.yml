name: IRYS V16 read-only Cloudflare Observability historical Telegram receipts
on:
  push:
    branches: [fix/irys-v16-ai-first-early-watch-20261030]
    paths:
      - 'audits/v16_readonly_cloudflare_logs_20261030.mjs'
      - '.github/workflows/v16-readonly-cloudflare-observability.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      IRYS_V7_CF_API_TOKEN: ${{ secrets.IRYS_V7_CF_API_TOKEN }}
      IRYS_REALTIME_CF_ACCOUNT_ID: ${{ secrets.IRYS_REALTIME_CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Query existing Cloudflare Workers event logs without code deployment
        run: |
          node --check audits/v16_readonly_cloudflare_logs_20261030.mjs
          node audits/v16_readonly_cloudflare_logs_20261030.mjs
