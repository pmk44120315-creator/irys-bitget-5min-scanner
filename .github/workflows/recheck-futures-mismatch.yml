name: IRYS Bitget historical mismatch cause diagnostic no deployment
on:
  push:
    branches: [fix/irys-evidence-gates-20261028]
    paths:
      - 'diagnostics/recheck_futures_cvd_rejection.py'
      - '.github/workflows/recheck-futures-mismatch.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile fixed historical completed 15m market against public fills
        run: python diagnostics/recheck_futures_cvd_rejection.py
