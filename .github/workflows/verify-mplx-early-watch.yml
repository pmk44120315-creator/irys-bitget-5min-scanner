name: IRYS MPLX early-watch source proof & no-buy regression (NO DEPLOYMENT)
on:
  push:
    branches: [fix/irys-mplx-early-watch-20261028]
    paths:
      - 'spot_flow.py'
      - 'tests/test_mplx_replay_20261028.py'
      - '.github/workflows/verify-mplx-early-watch.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify all collector/spot/AI regressions and exact MPLX historical changes
        run: |
          python -m py_compile collector.py spot_flow.py spot_continuity.py
          python -m unittest discover -s tests -p 'test_*.py' -v
          python -m unittest discover -s ai_twin/tests -p 'test_*.py' -v
