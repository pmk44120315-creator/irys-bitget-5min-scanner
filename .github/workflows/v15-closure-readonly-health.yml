name: IRYS V15 current production delivery and direction health READ ONLY
on:
  push:
    branches: [fix/irys-v15-telegram-closure-20261030]
    paths:
      - '.github/workflows/v15-closure-readonly-health.yml'
      - 'audits/v15-closure-health.marker'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      IRYS_V7_CF_API_TOKEN: ${{ secrets.IRYS_V7_CF_API_TOKEN }}
      IRYS_REALTIME_CF_ACCOUNT_ID: ${{ secrets.IRYS_REALTIME_CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm real Cloudflare SHA, latest Cron, candidate rejections and Telegram API receipt
        run: |
          node --check deployment/check-v15-live.mjs
          node deployment/check-v15-live.mjs
