name: IRYS V13 causal directional guarded code-only rollout (one-time marker)
on:
  push:
    branches: [fix/irys-v13-directional-proof-outcomes-20261029]
    paths:
      - 'deployment/IRYS_V13_RELEASE_APPROVED_20261029.txt'
permissions:
  contents: read
concurrency:
  group: irys-surge-monitor-v13-release-once
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      IRYS_V7_CF_API_TOKEN: ${{ secrets.IRYS_V7_CF_API_TOKEN }}
      IRYS_REALTIME_CF_ACCOUNT_ID: ${{ secrets.IRYS_REALTIME_CF_ACCOUNT_ID }}
      IRYS_V13_RELEASE_ONCE: AUTHORIZED_FROM_REVIEWED_MARKER
      IRYS_V13_RELEASE_DRY_RUN: '0'
      IRYS_V13_EXPECTED_SHA256: 'fe282f1742385db5f12db2f77fd32252db972b9852698d388360937e6996e5a2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify reviewed marker immutable V13 source and prevent any earlier SHA rollout
        run: |
          grep -Fxq 'IRYS_V13_RELEASE_MARKER=CAUSAL_DIRECTION_POST_ALERT_VALIDATED_20261029' deployment/IRYS_V13_RELEASE_APPROVED_20261029.txt
          grep -Fxq 'V13_SHA256=fe282f1742385db5f12db2f77fd32252db972b9852698d388360937e6996e5a2' deployment/IRYS_V13_RELEASE_APPROVED_20261029.txt
          test "$(sha256sum deployment/IRYS_V13_CAUSAL_DIRECTION_OUTCOMES_WORKER.mjs | cut -d' ' -f1)" = "$IRYS_V13_EXPECTED_SHA256"
      - name: Final full original Python and V13 real-market response regressions
        run: |
          node --check deployment/IRYS_V13_CAUSAL_DIRECTION_OUTCOMES_WORKER.mjs
          node --check deployment/release-v13-safe.mjs
          python -m unittest discover -s tests -p 'test_*.py' -v
          python -m unittest discover -s ai_twin/tests -p 'test_*.py' -v
          node --test tests/test_irys_v13_directional_outcomes.mjs
      - name: Replace only existing irys-surge-monitor script under exact live V12 SHA lease and verified rollback
        run: node deployment/release-v13-safe.mjs
