name: IRYS V35.1 delivery-first repair and exact natural verification
on:
  push:
    branches: [fix/irys-v35-1-resume-20261106]
    paths: ['.github/workflows/v351-verified-release.yml','diagnostics/v351_delivery.patch','deployment/build_v351_worker.py','tests/test_v351*.mjs']
permissions:
  contents: write
  actions: read
concurrency:
  group: irys-v27-guarded-worker-source
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: v35-deployed-natural-proof
          run-id: 42083867409
          github-token: ${{ github.token }}
          path: /tmp/v35_prior
      - uses: actions/download-artifact@v4
        with:
          name: v31-guarded-production-natural-proof
          run-id: 41814867318
          github-token: ${{ github.token }}
          path: /tmp/v31_prior
      - uses: actions/download-artifact@v4
        with:
          name: v30-selective-production-natural-proof
          run-id: 41693577194
          github-token: ${{ github.token }}
          path: /tmp/v30_prior
      - uses: actions/download-artifact@v4
        with:
          name: v28-production-and-natural-verification
          run-id: 41450016477
          github-token: ${{ github.token }}
          path: /tmp/v28_prior
      - name: Reproduce old ordering failure before applying reviewed patch
        run: |
          mkdir -p v351_release
          if git apply --check diagnostics/v351_delivery.patch; then
            if node --test tests/test_v351_delivery_first.mjs > v351_release/reproduced_failures.log 2>&1; then
              echo '::error::Expected old failure was not reproduced'
              exit 1
            fi
            git apply diagnostics/v351_delivery.patch
          elif git apply --reverse --check diagnostics/v351_delivery.patch; then
            echo 'Exact repair already applied'
          else
            exit 1
          fi
          echo '78413d266eab64ac0ccdc9a3c9a8501977b36a1993f82c1f8f22c2d52992d19d  deployment/v30_delivery.mjs' | sha256sum -c -
          python diagnostics/v351_prepare_guard.py
      - name: Reconstruct immutable prior fixtures and exact repaired Worker
        run: |
          git fetch --quiet --depth=1 origin release/irys-v24-bitget-fallback-20261101
          git show FETCH_HEAD:deployment/IRYS_V24_BITGET_FALLBACK_WORKER.mjs > /tmp/v24.mjs
          python deployment/build_v27_worker.py /tmp/v24.mjs deployment/IRYS_V27_RESPONSE_WORKER.mjs
          python deployment/build_v28_worker.py deployment/IRYS_V27_RESPONSE_WORKER.mjs deployment/IRYS_V28_BUILDUP_WORKER.mjs
          python deployment/build_v29_worker.py deployment/IRYS_V28_BUILDUP_WORKER.mjs deployment/IRYS_V29_DIRECTION_REVIEW_WORKER.mjs
          cp /tmp/v30_prior/IRYS_V30_SELECTIVE_DIRECTION_WORKER.mjs deployment/
          cp /tmp/v31_prior/IRYS_V31_TIMELY_WORKER.mjs deployment/
          python deployment/build_v34_worker.py deployment/IRYS_V31_TIMELY_WORKER.mjs deployment/IRYS_V34_CRASH_WARNING_WORKER.mjs
          cp /tmp/v35_prior/IRYS_V35_LIFECYCLE_WORKER.mjs deployment/
          echo '949cc9b7392e7f6bbf7ce710509b804ce734cf6b123294b1a2c530cfdc2669aa  deployment/IRYS_V35_LIFECYCLE_WORKER.mjs' | sha256sum -c -
          python deployment/build_v351_worker.py deployment/IRYS_V35_LIFECYCLE_WORKER.mjs deployment/IRYS_V351_DELIVERY_FIRST_WORKER.mjs
          echo '6356cf5919e5dd05808d9b84bf92378393cc0b9a9da31e964d93566cc86c0d13  deployment/IRYS_V351_DELIVERY_FIRST_WORKER.mjs' | sha256sum -c -
          node --check deployment/IRYS_V351_DELIVERY_FIRST_WORKER.mjs
      - name: Full original regression, current-signal ordering and unchanged risk tests
        env:
          V27_BASE_WORKER: /tmp/v24.mjs
          V28_BASE_WORKER: deployment/IRYS_V27_RESPONSE_WORKER.mjs
          V28_RELEASE_BASE_WORKER: /tmp/v28_prior/IRYS_V28_BUILDUP_WORKER.mjs
          V29_BASE_WORKER: deployment/IRYS_V28_BUILDUP_WORKER.mjs
          V30_BASE_WORKER: deployment/IRYS_V29_DIRECTION_REVIEW_WORKER.mjs
          V34_BASE_WORKER: deployment/IRYS_V31_TIMELY_WORKER.mjs
          V35_BASE_WORKER: deployment/IRYS_V34_CRASH_WARNING_WORKER.mjs
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee v351_release/python_tests.log
          node --test tests/*.mjs 2>&1 | tee v351_release/node_tests.log
      - name: Preserve verified ordinary code on same feature branch; never overwrite market data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment/v30_delivery.mjs deployment/release_v351_guarded.mjs tests/test_v351_release_guard.mjs
          if ! git diff --staged --quiet; then
            git fetch --quiet origin fix/irys-v35-1-resume-20261106
            test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
            git commit -m 'fix(v35.1): current signal before slow housekeeping; expire old signals despite feed outage'
            git push origin HEAD:fix/irys-v35-1-resume-20261106
          fi
          git rev-parse HEAD > v351_release/tested_commit.txt
      - name: Exact V35 lease and settings-preserving ordinary production code update
        env:
          CF_ACCOUNT: ${{ secrets.IRYS_REALTIME_CF_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.IRYS_V7_CF_API_TOKEN }}
        run: node deployment/release_v351_guarded.mjs
      - name: Observe actual next natural scheduled cycle, no forced scan or test Telegram
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';import assert from 'node:assert/strict';
          const released=JSON.parse(readFileSync('v351_release/deployment.json','utf8'));
          const target=Math.ceil(Date.parse(released.at_utc)/300000)*300000,deadline=target+210000;
          const ms=s=>typeof s==='string'?Date.parse(s.replace(' KST','+09:00').replace(' ','T')):NaN;let health;const reads=[];
          do{const r=await fetch('https://irys-surge-monitor.vhehwpfl.workers.dev/?v351proof='+Date.now(),{signal:AbortSignal.timeout(20000)});assert(r.ok);health=await r.json();const l=health.last||{};
            reads.push({at_ms:Date.now(),time:l.time,version:l.codeVersion,status:l.status});if(l.codeVersion===released.version&&ms(l.time)>=target)break;
            if(Date.now()>=deadline)break;await new Promise(r=>setTimeout(r,10000));
          }while(Date.now()<=deadline);
          const l=health.last||{},d=l.v30DirectionalDelivery||{},risk=l.v34MarketRisk||{},coverage=l.v23DirectFastScout?.v28Discovery||{};
          const proof={at_utc:new Date().toISOString(),version:l.codeVersion,tick_kst:l.time,status:l.status,dispatch:l.githubDispatchStatus,
            delivery_first_enabled:health.deliveryFirstLifecycleEnabled===true,entry_enabled:health.marketNotificationsEnabled===true,risk_enabled:health.marketRiskWarningsEnabled===true,
            entry_status:d.status,entry_feed:d.feed,entry_sent:d.sent,delivery_phase_completed_at_ms:d.delivery_phase_completed_at_ms,
            status_updates_after_delivery_decision:d.status_updates_after_delivery_decision,post_delivery_audit_status:d.post_delivery_audit_status,post_delivery_housekeeping_ms:d.post_delivery_housekeeping_ms,
            lifecycle:d.signal_lifecycle,actual_outcomes:d.actual_alert_outcomes,source_summary:d.source_summary,
            risk_status:risk.status,risk_feed:risk.feed,coverage:{listed:coverage.listed,tracked:coverage.tracked},last_public_ack:l.telegramLastApiReceipt,
            predictor_rules_changed:false,prediction_improvement_proven:false,no_manual_scan_or_test_messages:true,device_receipt_verified:false};
          writeFileSync('v351_release/natural_proof.json',JSON.stringify(proof,null,2));writeFileSync('v351_release/health.json',JSON.stringify(health,null,2));writeFileSync('v351_release/reads.json',JSON.stringify(reads,null,2));
          console.log('V351_NATURAL_PROOF',JSON.stringify(proof));
          assert.equal(l.codeVersion,released.version);assert(ms(l.time)>=target);assert.equal(l.status,'PASS');assert.equal(l.githubDispatchStatus,'ACCEPTED');
          assert(proof.delivery_first_enabled&&proof.entry_enabled&&proof.risk_enabled);assert.equal(d.feed?.ok,true);assert.equal(d.status_updates_after_delivery_decision,true);assert.equal(d.post_delivery_audit_status,'COMPLETED');
          assert(d.signal_lifecycle&&d.signal_lifecycle.edit_errors===0);assert.equal(risk.feed?.ok,true);assert(coverage.listed>=100&&coverage.tracked===coverage.listed);
          assert(!['DIRECTION_DELIVERY_RUNTIME_ERROR','EVIDENCE_SOURCE_NOT_READY','DELIVERY_STATE_UNVERIFIED','DELIVERY_RESERVATION_FAILED','DELIVERY_UNCERTAIN','TELEGRAM_ACK_NOT_VERIFIED','ACK_RECEIPT_PERSISTENCE_PARTIAL'].includes(d.status));
          JS
      - name: Freeze exact source, successful stages and failures without deleting evidence
        if: always()
        run: |
          mkdir -p v351_release
          test ! -f deployment/IRYS_V351_DELIVERY_FIRST_WORKER.mjs || cp deployment/IRYS_V351_DELIVERY_FIRST_WORKER* v351_release/
          git archive --format=zip --output=v351_release/verified_source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v351-delivery-first-production-proof
          path: v351_release/
          retention-days: 7
          if-no-files-found: error
