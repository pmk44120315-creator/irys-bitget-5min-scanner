name: IRYS V15 one-time Telegram proof guarded code-only Cloudflare rollout
on:
  push:
    branches: [fix/irys-v15-telegram-closure-20261030]
    paths:
      - 'deployment/IRYS_V15_TRANSPORT_PROOF_APPROVED_20261030.txt'
permissions:
  contents: read
concurrency:
  group: irys-surge-monitor-v14-release-once
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      IRYS_V7_CF_API_TOKEN: ${{ secrets.IRYS_V7_CF_API_TOKEN }}
      IRYS_REALTIME_CF_ACCOUNT_ID: ${{ secrets.IRYS_REALTIME_CF_ACCOUNT_ID }}
      IRYS_V14_RELEASE_ONCE: AUTHORIZED_FROM_REVIEWED_MARKER
      IRYS_V14_RELEASE_DRY_RUN: '0'
      IRYS_V14_EXPECTED_SHA256: 'ee166d49a0107d78fc747ca1f1b564e6af28b729ae3a0a5e716a89c9a2e2c52a'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require exact one-time nontrading Telegram test marker and reviewed bytes
        run: |
          grep -Fxq 'IRYS_V15_TELEGRAM_TEST_APPROVED=USER_REQUEST_20261030' deployment/IRYS_V15_TRANSPORT_PROOF_APPROVED_20261030.txt
          grep -Fxq 'WORKER_SHA256=ee166d49a0107d78fc747ca1f1b564e6af28b729ae3a0a5e716a89c9a2e2c52a' deployment/IRYS_V15_TRANSPORT_PROOF_APPROVED_20261030.txt
          test "$(sha256sum deployment/IRYS_V15_TELEGRAM_TRANSPORT_PROOF_WORKER.mjs | cut -d' ' -f1)" = "$IRYS_V14_EXPECTED_SHA256"
      - name: Validate Telegram one-shot safety and unaffected real-market contracts offline
        run: |
          node --check deployment/IRYS_V15_TELEGRAM_TRANSPORT_PROOF_WORKER.mjs
          node --check deployment/release-v15-telegram-once-safe.mjs
          node --test tests/test_irys_v15_telegram_proof.mjs tests/test_irys_v13_directional_outcomes.mjs tests/test_irys_v14_native_direction.mjs tests/test_irys_v14_flow_diet.mjs
          python -m unittest discover -s tests -p 'test_*.py' -v
          python -m unittest discover -s ai_twin/tests -p 'test_*.py' -v
      - name: Replace only existing irys-surge-monitor source with exact previous SHA lease and rollback
        run: node deployment/release-v15-telegram-once-safe.mjs
