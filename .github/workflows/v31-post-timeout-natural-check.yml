name: IRYS V31 post-timeout natural runtime verification (READ ONLY)
on:
  push:
    branches: [fix/irys-v31-latency-quality-20261104]
    paths: ['.github/workflows/v31-post-timeout-natural-check.yml']
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: v31-guarded-production-natural-proof
          run-id: 41814867318
          github-token: ${{ github.token }}
          path: /tmp/prior
      - name: Read actual next natural run and distinguish timeout from a claimed successful release
        run: |
          mkdir -p v31_verified
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';import assert from 'node:assert/strict';
          const deployed=JSON.parse(readFileSync('/tmp/prior/deployment.json','utf8'));
          const failed=JSON.parse(readFileSync('/tmp/prior/natural_proof.json','utf8'));
          const ms=s=>typeof s==='string'?Date.parse(s.replace(' KST','+09:00').replace(' ','T')):NaN;
          const target=ms(failed.tick_kst)+300000,deadline=Math.max(Date.now(),target)+180000;let health;const reads=[];
          do{
            const r=await fetch('https://irys-surge-monitor.vhehwpfl.workers.dev/?v31follow='+Date.now(),{signal:AbortSignal.timeout(20000)});assert(r.ok,'PUBLIC_HEALTH_'+r.status);health=await r.json();
            const l=health.last||{};reads.push({at_ms:Date.now(),tick:l.time,version:l.codeVersion,status:l.status,dispatch:l.githubDispatchStatus});
            if(l.codeVersion===deployed.version&&ms(l.time)>=target)break;
            if(Date.now()>=deadline)break;await new Promise(r=>setTimeout(r,10000));
          }while(Date.now()<=deadline);
          const l=health?.last||{},d=l.v30DirectionalDelivery||{},coverage=l.v23DirectFastScout?.v28Discovery||{};
          const proof={verified_at_utc:new Date().toISOString(),deployed_at_utc:deployed.at_utc,source_sha256:deployed.source_sha256,
            version:l.codeVersion,tick_kst:l.time,status:l.status,dispatch:l.githubDispatchStatus,dispatch_error:l.githubDispatchError,
            selective_notifications_enabled:health.marketNotificationsEnabled===true&&l.marketNotificationsEnabled===true,
            delivery:d,coverage:{listed:coverage.listed,tickers:coverage.tickers,tracked:coverage.tracked},
            ack_this_tick:l.telegramApiAckedThisRun,last_public_ack:l.telegramLastApiReceipt,
            prior_failed_tick:failed.tick_kst,prior_failure_not_erased:true,device_receipt_verified:false,future_accuracy_improvement_proven:false,
            read_only:true,manual_scan_or_test_messages:false,production_code_changed:false};
          writeFileSync('v31_verified/natural_proof.json',JSON.stringify(proof,null,2));writeFileSync('v31_verified/health.json',JSON.stringify(health,null,2));writeFileSync('v31_verified/reads.json',JSON.stringify(reads,null,2));
          console.log('V31_AFTER_TIMEOUT_REAL_PROOF',JSON.stringify(proof));
          assert.equal(l.codeVersion,deployed.version);assert(ms(l.time)>=target,'NEXT_NATURAL_TICK_NOT_OBSERVED');assert.equal(l.status,'PASS');assert.equal(l.githubDispatchStatus,'ACCEPTED');
          assert(proof.selective_notifications_enabled);assert.equal(d.feed?.ok,true);assert.equal(d.policy,'QUALIFIED_CURRENT_DIRECTION_ONLY');
          assert(d.source_summary?.listed_spot>=100&&d.source_summary?.listed_futures>=100);
          assert(d.actual_alert_outcomes?.minute_close_proxies?.horizons?.['5']?.measured>0,'ACTUAL_ACK_MINUTE_RECOVERY_NOT_VERIFIED');
          assert(!['DIRECTION_DELIVERY_RUNTIME_ERROR','EVIDENCE_SOURCE_NOT_READY','DELIVERY_STATE_UNVERIFIED','DELIVERY_RESERVATION_FAILED','TELEGRAM_ACK_NOT_VERIFIED','DELIVERY_UNCERTAIN','ACK_RECEIPT_PERSISTENCE_PARTIAL'].includes(d.status));
          const res=await fetch('https://raw.githubusercontent.com/pmk44120315-creator/irys-bitget-5min-scanner/main/data/v30_direction_latest.json?v31proof='+Date.now(),{signal:AbortSignal.timeout(20000)});assert(res.ok);const doc=await res.json();
          writeFileSync('v31_verified/public_producer.json',JSON.stringify(doc));
          assert.equal(doc.model_digest,'0f5b9a9f4fff19d148901583c52d1b77b8f1b04be0512f778f4ee5c2f15526ec');assert.equal(doc.timing.barrier_removed,true);
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v31-after-timeout-natural-verification
          path: v31_verified/
          retention-days: 7
          if-no-files-found: error
