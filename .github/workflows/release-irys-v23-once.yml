name: IRYS V23 guarded direct-first live Cloudflare release
on:
  push:
    branches:
      - feature/irys-v23-direct-fast-scout-20261101
    paths:
      - '.github/workflows/release-irys-v23-once.yml'
      - 'deployment/release_v23_guarded.mjs'
permissions:
  contents: read
concurrency:
  group: irys-production-worker-code-only-release
  cancel-in-progress: false
jobs:
  guarded-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full existing market regression and V23 direct-first alert/UTC clock proof
        run: |
          python -m unittest discover -s tests -v
          node --check deployment/IRYS_V23_DIRECT_SCOUT_WORKER.mjs
          node --check deployment/release_v23_guarded.mjs
          node --test tests/test_v23_direct_scout.mjs tests/test_v23_worker_integration.mjs
          node --test tests/test_v21_delivery.mjs tests/test_v21_report_timing.mjs tests/test_v21_forecast_expiry.mjs
          echo 'f53ced30287544784d92bf74bb644177add46379781cdb7e3874a9ec1ee2c182  deployment/IRYS_V23_DIRECT_SCOUT_WORKER.mjs' | sha256sum -c -
      - name: Read-only original Worker, Cron, bindings and exact SHA
        env:
          IRYS_REALTIME_CF_ACCOUNT_ID: ${{ secrets.IRYS_REALTIME_CF_ACCOUNT_ID }}
          IRYS_V7_CF_API_TOKEN: ${{ secrets.IRYS_V7_CF_API_TOKEN }}
          IRYS_V23_RELEASE_INTENT: USER_APPROVED_FAST_EARLY_DETECTION_AND_DIRECTION_EVIDENCE_20261101
          IRYS_V23_DRY_RUN: 'true'
        run: node deployment/release_v23_guarded.mjs
      - name: Release only reviewed Cloudflare Worker code with exact-byte rollback
        env:
          IRYS_REALTIME_CF_ACCOUNT_ID: ${{ secrets.IRYS_REALTIME_CF_ACCOUNT_ID }}
          IRYS_V7_CF_API_TOKEN: ${{ secrets.IRYS_V7_CF_API_TOKEN }}
          IRYS_V23_RELEASE_INTENT: USER_APPROVED_FAST_EARLY_DETECTION_AND_DIRECTION_EVIDENCE_20261101
          IRYS_V23_DRY_RUN: 'false'
        run: node deployment/release_v23_guarded.mjs
